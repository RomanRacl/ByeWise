}

// ---------- Import ----------
function tabImport(pane) {
  pane.innerHTML = `<div class="card">
    <label class="field">Do odvětví<select id="icat">${catOptions(adm.cat)}</select></label>
    <span class="seg" role="group" aria-label="Typ importu" style="margin-top:12px">
      <button type="button" data-action="adm-src" data-src="csv" aria-pressed="true">CSV / Excel</button>
      <button type="button" data-action="adm-src" data-src="text" aria-pressed="false">Textový žebříček</button>
      <button type="button" data-action="adm-src" data-src="sda" aria-pressed="false">Tisková zpráva SDA</button>
    </span>
    <p class="small muted" id="ihelp"></p>
    <label class="field" id="fileWrap">Soubor (.csv, .xlsx)<input type="file" id="ifile" accept=".csv,.txt,.xlsx,.xls"></label>
    <label class="field">Text<textarea id="itext"></textarea></label>
    <div class="btns"><button class="btn alt" data-action="adm-iprev">Načíst náhled</button></div>
    <div id="ipreview"></div><p class="msg" id="imsg"></p></div>`;
  let src = 'csv';
  const help = {
    csv: 'Sloupce oddělené středníkem nebo tabulátorem: pořadí; název; podtitul; cena; poptávka; konkurence (Alza=24990|Datart=25490). Soubor z Excelu (.xlsx) se převede sám.',
    text: 'Řádky typu „1. Autor: Název – 499 Kč“ nebo „2) Název – podtitul“. Hodí se pro žebříčky knih a top seznamy z webu.',
    sda: 'Vlož text tiskové zprávy Svazu dovozců automobilů (portal.sda-cia.cz). Načte se pořadí modelů a počty registrací. Ceny pak doplníš hromadnou úpravou.',
  };
  const setSrc = (s) => {
    src = s;
    pane.querySelectorAll('[data-src]').forEach((x) => x.setAttribute('aria-pressed', x.dataset.src === s));
    pane.querySelector('#ihelp').textContent = help[s];
    pane.querySelector('#fileWrap').hidden = s !== 'csv';
    if (s === 'sda') pane.querySelector('#icat').value = 'auta';
  };
  setSrc('csv');
  let rows = [];
  actions({ 'adm-src': (b) => setSrc(b.dataset.src) });
  pane.querySelector('#ifile').addEventListener('change', async (e) => {
    const f = e.target.files[0];
    if (!f) return;
    try {
      pane.querySelector('#itext').value = /\.xlsx?$/i.test(f.name) ? await xlsxToCsv(f) : await f.text();
    } catch (err) {
      msg(pane.querySelector('#imsg'), err.message);
    }
  });
  actions({ 'adm-iprev': () => {
    const text = pane.querySelector('#itext').value;
    rows = src === 'csv' ? parseCsv(text) : src === 'text' ? parseRankingText(text) : parseSda(text);
    const box = pane.querySelector('#ipreview');
    if (!rows.length) {
      box.innerHTML = '';
      return msg(pane.querySelector('#imsg'), 'Nenašel jsem žádné řádky. Zkontroluj formát.');
    }
    msg(pane.querySelector('#imsg'), '', true);
    const cat = pane.querySelector('#icat').value;
    box.innerHTML = `<div class="table-wrap"><table class="cmp"><thead><tr><th>Pořadí</th><th>Název</th><th>Podtitul</th><th class="num">Cena</th><th>Poptávka</th><th>Konkurence</th></tr></thead><tbody>${rows
      .map((r) => `<tr><td>${r.rank}</td><td>${esc(r.name)}</td><td>${esc(r.subtitle || '')}</td><td class="num">${esc(r.price ?? '')}</td><td>${esc(r.demand || '')}</td><td>${(r.competitors || []).map((c) => esc(`${c.name} ${c.price}`)).join(', ')}</td></tr>`)
      .join('')}</tbody></table></div>
      <p class="small muted">Produkty z odvětví ${esc(categoryById(cat).name)}, které v importu chybí, se označí jako vypadlé z žebříčku.</p>
      <div class="btns"><button class="btn" data-action="adm-igo">Importovat ${rows.length} řádků</button></div>`;
  } });
  actions({ 'adm-igo': (b) =>
      busy(b, async () => {
        const box = pane.querySelector('#ipreview');
        const cat = pane.querySelector('#icat').value;
        try {
          const r = await adminApi('importRows', { category: cat, rows, source: { csv: 'CSV/Excel', text: 'textový žebříček', sda: 'SDA' }[src] });
          msg(pane.querySelector('#imsg'), `Importováno ${r.imported} řádků.`, true);
          box.innerHTML = '';
        } catch (err) {
          msg(pane.querySelector('#imsg'), err.message);
        }
      }),
  });
}

      <div class="table-wrap"><table class="cmp"><thead><tr><th>Produkt</th><th>Odvětví</th><th class="num">Teď</th><th class="num">Návrh</th></tr></thead><tbody>${pending.proposals
        .map((x) => `<tr><td>${esc(x.name)}</td><td>${esc(categoryById(x.category)?.name || x.category)}</td><td class="num">${x.oldActive && x.oldRank ? x.oldRank + '.' : 'mimo'}</td><td class="num"><strong>${x.active && x.rank ? x.rank + '.' : 'mimo'}</strong></td></tr>`)

    actions({
      'adm-pend': (b) =>

          const act = b.dataset.v;
          const r = await adminApi(act);

          tabPending(pane);
        }),

    pane.innerHTML = `<p class="msg err">${esc(e.message)}</p>`;
  }
}

// ---------- Historie ----------
async function tabAudit(pane) {
  pane.innerHTML = '<p class="muted">Načítám…</p>';
  try {
    const { entries } = await adminApi('audit');
    pane.innerHTML = entries.length
      ? `<div class="card"><ul class="adm-list">${entries
          .map((x) => `<li><span class="nm">${esc(x.action)}${x.target ? `: ${esc(x.target)}` : ''}<small>${new Date(x.at).toLocaleString('cs-CZ')}, ${esc(x.who)}${x.summary ? ` – ${esc(x.summary)}` : ''}</small></span></li>`)
          .join('')}</ul></div>`
      : '<div class="card"><p>Zatím žádné úpravy.</p></div>';
  } catch (e) {
    pane.innerHTML = `<p class="msg err">${esc(e.message)}</p>`;
  }
}

// ---------- Data a zálohy ----------
async function tabData(pane) {
  pane.innerHTML = `<div class="card"><h3>Stav</h3><div id="status" class="small muted">Načítám…</div>
    <div class="btns">
      <button class="btn alt" data-action="adm-seed">${adminLocal ? 'Obnovit ukázková data' : 'Naplnit výchozími daty'}</button>
      ${adminLocal ? '' : '<button class="btn alt" data-action="adm-upd" data-weekly="0">Aktualizovat živá data teď</button><button class="btn alt" data-action="adm-upd" data-weekly="1">Spustit i týdenní úlohy (souhrn, záloha)</button>'}
    </div><p class="msg" id="dmsg"></p></div>
    <div class="card"><h3>Záloha</h3><p class="small muted">Celá databáze (produkty s historií a nastavení) jako soubor JSON. ${adminLocal ? '' : 'Automatická záloha se ukládá každou neděli do Firebase Storage, pokud je nastavený FIREBASE_STORAGE_BUCKET.'}</p>
      <div class="btns"><button class="btn alt" data-action="adm-bk">Stáhnout zálohu</button><label class="btn alt" for="rs">Obnovit ze zálohy</label><input type="file" id="rs" accept="application/json,.json" hidden></div><p class="msg" id="bmsg"></p></div>
    <p class="note">Stav zdrojů a přesnost odhadů najdeš na stránce <a href="${link('/stav')}">Stav dat</a>.</p>`;
  const dmsg = pane.querySelector('#dmsg');
  const loadStatus = async () => {
    try {
      const j = await adminApi('status');
      const m = j.meta;
      pane.querySelector('#status').innerHTML = `Produktů v databázi: <strong>${j.count}</strong>. Přihlášen: ${esc(j.who || '')}. ${m?.finishedAt ? `Poslední aktualizace: ${new Date(m.finishedAt).toLocaleString('cs-CZ')}.` : adminLocal ? '' : 'Automatická aktualizace zatím neproběhla.'}${j.pending ? ` <strong>${j.pending} změn čeká na schválení.</strong>` : ''}${m?.log?.length ? `<pre class="log">${esc(m.log.join('\n'))}${m.errors?.length ? '\n\nChyby:\n' + esc(m.errors.join('\n')) : ''}</pre>` : ''}`;
    } catch (e) {
      pane.querySelector('#status').textContent = e.message;
    }
  };
  loadStatus();
  actions({ 'adm-seed': (b) =>
    busy(b, async () => {
      if (adminLocal && !confirm('Smazat všechny tvoje úpravy a vrátit ukázková data?')) return;
      try {
        const j = await adminApi('seed');
        msg(dmsg, adminLocal ? 'Ukázková data obnovena.' : `Přidáno ${j.added} výchozích produktů. Ceny jsou orientační, zkontroluj je.`, true);
        loadStatus();
      } catch (err) {
        msg(dmsg, err.message);
      }
    }),
    'adm-upd': (b) =>
      busy(b, async () => {
        const weekly = b.dataset.weekly === '1';
        msg(dmsg, 'Stahuji data ze Steamu, Yahoo Finance, CoinGecko, ČNB a feedů…', true);
        try {
          const r = await adminApi('update', { weekly });
          msg(dmsg, r.status.errors?.length ? `Hotovo s ${r.status.errors.length} chybami.` : 'Živá data aktualizována.', !r.status.errors?.length);
          loadStatus();
        } catch (err) {
          msg(dmsg, err.message);
        }
      }),
    'adm-bk': (b) =>
    busy(b, async () => {
      try {
        const { backup } = await adminApi('backup');
        downloadFile(`buywise-zaloha-${new Date().toISOString().slice(0, 10)}.json`, JSON.stringify(backup), 'application/json');
        msg(pane.querySelector('#bmsg'), 'Záloha stažena.', true);
      } catch (err) {
        msg(pane.querySelector('#bmsg'), err.message);
      }
    }),
  });
  pane.querySelector('#rs').addEventListener('change', async (e) => {
    const f = e.target.files[0];
    if (!f) return;
    try {
      const j = JSON.parse(await f.text());
      const products = Array.isArray(j) ? j : j.products;
      if (!confirm(`Obnovit ${products?.length || 0} produktů ze zálohy? Stávající produkty se stejným ID se přepíšou.`)) return;
      const r = await adminApi('restore', { products, settings: j.settings });
      msg(pane.querySelector('#bmsg'), `Obnoveno ${r.restored} produktů.`, true);
      loadStatus();
    } catch (err) {
      msg(pane.querySelector('#bmsg'), err.message);
    }
    e.target.value = '';
  });
}


return { uploadPhoto, renderAdmin };
})();

// ----- js/views/wishlist.js -----
const __js_views_wishlist_js = (() => {
// Chytrý seznam přání: co chci koupit, cílová cena a doporučení, kdy koupit (skóre Kup teď / Počkej).
const { S, categoryById, catName, productById, sum, money, pct, pctClass, esc, priceText, productLink, link, catLink, ICON, toast, hero, sheet, insight, scoreBadge, scoreWhen, conv, unitOf, CATEGORIES } = __js_core_js;
const { actions, reducedMotion } = __js_ui_js;
const { sparkline } = __js_chart_js;
const { wish, apiUser, authAvailable } = __js_user_js;
const { t, tk } = __js_i18n_js;

function renderWishlist(main) {
  document.title = `${t('Seznam přání')} – BuyWise`;
  const items = wish
    .list()
    .map((w) => ({ w, p: productById(w.id) }))
    .filter((x) => x.p)
    .map((x) => ({ ...x, s: sum(x.p), sc: insight(x.p).score }))
    .sort((a, b) => (b.sc?.score ?? -1) - (a.sc?.score ?? -1));
  const buyNow = items.filter((x) => x.sc?.tone === 'buy' || (x.w.target && x.s.price <= x.w.target));
  const total = items.reduce((a, x) => a + (x.p.unit?.startsWith('Kč') && !x.p.unit.includes('/') ? x.s.price || 0 : 0), 0);
  const saved = items.reduce((a, x) => a + (x.w.addedPrice && x.p.unit?.startsWith('Kč') ? x.w.addedPrice - (x.s.price || 0) : 0), 0);
  const canDigest = !!(S.profile && S.profile.features?.email);

  const row = (x) => {
    const { w, p, s, sc } = x;
    const u = p.unit || 'Kč';
    const since = w.addedPrice ? ((s.price - w.addedPrice) / w.addedPrice) * 100 : null;
    const hit = w.target && s.price <= w.target;
    const progress = w.target && w.addedPrice && w.addedPrice > w.target ? Math.max(0, Math.min(100, ((w.addedPrice - s.price) / (w.addedPrice - w.target)) * 100)) : hit ? 100 : null;
    return `<li class="wish ${hit ? 'hit' : ''}" data-pid="${esc(p.id)}">
      <div class="wish-score">${scoreBadge(sc, { size: 'lg' })}</div>
      <div class="wish-main">
        <a class="nm" href="${productLink(p.id)}" data-prefetch="${esc(p.id)}">${esc(p.name)}</a>
        <span class="sub">${esc(catName(categoryById(p.category)))}${p.subtitle ? `, ${esc(p.subtitle)}` : ''}</span>
        <p class="wish-when ${sc?.tone || ''}"><b>${esc(t(sc?.label || 'Málo dat'))}:</b> ${esc(scoreWhen(sc, u))}</p>
        ${sc?.reasons?.length ? `<p class="note">${sc.reasons.slice(0, 2).map((r) => esc(tk(r))).join(' ')}</p>` : ''}
      </div>
      <div class="wish-price">
        <span class="spark">${sparkline(s.history, s.trend.dir, 110, 32)}</span>
        <b>${priceText(p, s)}</b>
        ${since != null ? `<small class="${pctClass(since)}">${pct(since)} ${t('od přidání')}</small>` : ''}
      </div>
      <div class="wish-target">
        <label class="field compact"><span>${t('Cílová cena')} (${esc(unitOf(u))})</span><input type="number" inputmode="decimal" min="0" data-target="${esc(p.id)}" value="${w.target ? +conv(w.target, u).v.toFixed(2) : ''}" placeholder="${esc(t('např. {p}', { p: money(s.price * 0.9, u, true) }))}"></label>
        ${progress != null ? `<div class="meter" role="meter" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${Math.round(progress)}" aria-label="${esc(t('Cesta k cílové ceně'))}"><span style="width:${progress}%"></span></div><small>${hit ? `<b class="chg-down">${t('Cíl splněn!')}</b>` : t('Zbývá {x}', { x: money(s.price - w.target, u) })}</small>` : ''}
      </div>
      <button type="button" class="icon-btn sm" data-action="w-rm" data-id="${esc(p.id)}" aria-label="${esc(t('Odebrat ze seznamu přání'))}" data-tip="${esc(t('Odebrat ze seznamu přání'))}">${ICON.close}</button>
    </li>`;
  };

  // Tipy na doplnění: produkty se skóre Kup teď, které v seznamu nejsou.
  const tips = S.data.products
    .filter((p) => p.active !== false && p.rank && !wish.has(p.id))
    .map((p) => ({ p, sc: insight(p).score }))
    .filter((x) => x.sc?.tone === 'buy')
    .sort((a, b) => b.sc.score - a.sc.score)
    .slice(0, 6);

  const account = S.standalone
    ? `<p class="note">${t('Samostatná HTML verze ukládá seznam přání jen v tomto prohlížeči.')}</p>`
    : S.user
    ? `<p class="note">${t('Seznam přání se synchronizuje mezi tvými zařízeními. Když cena klesne pod cílovou, pošleme e-mail.')}</p>
       ${canDigest ? `<label class="toggle"><input type="checkbox" id="w-digest" ${S.profile.weeklyDigest ? 'checked' : ''}> ${t('Posílat každé pondělí e-mail „BuyWise týden“ s mým seznamem přání')}</label>` : ''}`
    : authAvailable()
    ? `<p class="note">${t('Přihlas se a seznam budeš mít na všech zařízeních, s e-mailem při dosažení cílové ceny.')}</p><button type="button" class="btn alt" data-action="open-login">${t('Přihlásit se')}</button>`
    : `<p class="note">${t('Seznam přání se ukládá v tomto prohlížeči. Při návštěvě tě upozorníme, když je dobrá chvíle koupit.')}</p>`;

  main.innerHTML =
    hero({
      crumb: `<a href="${link('/')}">${t('Přehled')}</a>`,
      title: t('Seznam přání'),
      lead: t('Přidej si, co chceš koupit. BuyWise ohlídá nejlepší okamžik: odhad ceny, sezónu i falešné slevy.'),
      aside: items.length
        ? `<dl class="pulse"><div><dt>${t('v seznamu')}</dt><dd>${items.length}</dd></div><div><dt>${t('koupit teď')}</dt><dd class="down">${buyNow.length}</dd></div>${total ? `<div><dt>${t('celkem teď')}</dt><dd class="sm">${money(total)}</dd></div>` : ''}${saved > 0 ? `<div><dt>${t('zlevnilo od přidání')}</dt><dd class="sm down">${money(saved)}</dd></div>` : ''}</dl>`
        : '',
    }) +
    sheet(`
    <section class="card account-card">${account}</section>
    <section class="section">
      ${
        items.length
          ? `<ul class="wish-list" id="wishes">${items.map(row).join('')}</ul>`
          : `<div class="empty-state">${ICON.heart}<h2>${t('Seznam je zatím prázdný')}</h2><p>${t('Srdíčkem u produktu ho přidáš. Pak tu uvidíš, jestli koupit hned, nebo počkat.')}</p><a class="btn" href="${catLink(CATEGORIES.find((c) => c.kind === 'spotrebni').id)}">${t('Projít žebříčky')}${ICON.arrow}</a></div>`
      }
    </section>
    ${
      tips.length
        ? `<section class="section"><div class="section-head"><div><h2>${t('Teď se vyplatí koupit')}</h2><p>${t('Produkty se skóre 60 a víc, které ještě v seznamu nemáš')}</p></div></div>
      <ul class="list">${tips.map((x) => `<li data-pid="${esc(x.p.id)}" class="tip-row"><a class="item" href="${productLink(x.p.id)}"><span class="nm">${esc(x.p.name)}</span><span class="val">${scoreBadge(x.sc, { tip: false })}</span><span class="sub">${esc(catName(categoryById(x.p.category)))}, ${priceText(x.p, sum(x.p))}</span></a><button type="button" class="icon-btn sm wish-btn" data-action="wish" data-id="${esc(x.p.id)}" aria-pressed="false" aria-label="${esc(t('Přidat do seznamu přání'))}" data-tip="${esc(t('Přidat do seznamu přání'))}">${ICON.heart}</button></li>`).join('')}</ul></section>`
        : ''
    }`);

  actions({
    'w-rm': async (el) => {
      // Nejdřív animace odjezdu, pak smazání (uložení vyvolá překreslení stránky).
      const li = el.closest('li');
      if (li && !reducedMotion()) await li.animate([{ opacity: 1 }, { opacity: 0, transform: 'translateX(24px)' }], { duration: 220, easing: 'ease-in', fill: 'forwards' }).finished;
      await wish.toggle(el.dataset.id);
    },
  });
  // Cílová cena: uloží se po opuštění pole / Enteru (v Kč, i když je zobrazena jiná měna)
  main.querySelectorAll('[data-target]').forEach((inp) =>
    inp.addEventListener('change', async () => {
      const p = productById(inp.dataset.target);
      const v = parseFloat(inp.value.replace(',', '.'));
      const k = conv(1, p.unit || 'Kč').v || 1;
      await wish.update(p.id, { target: Number.isFinite(v) && v > 0 ? v / k : null });
      toast(Number.isFinite(v) && v > 0 ? t('Cílová cena uložena.') : t('Cílová cena smazána.'), 'ok', 2500);
    })
  );
  main.querySelector('#w-digest')?.addEventListener('change', async (e) => {
    try {
      await apiUser('setDigest', { on: e.target.checked });
      S.profile.weeklyDigest = e.target.checked;
      toast(e.target.checked ? t('Týdenní souhrn zapnutý.') : t('Týdenní souhrn vypnutý.'), 'ok');
    } catch (err) {
      e.target.checked = !e.target.checked;
      toast(esc(err.message), 'err');
    }
  });
  return true;
}

return { renderWishlist };
})();

function renderCalendar(main, query = new URLSearchParams()) {
  document.title = `${t('Nákupní kalendář')} – BuyWise`;

  const seasons = S.data.seasons || {};
  let sel = Math.max(0, Math.min(11, (parseInt(query.get('mesic'), 10) || now + 1) - 1));

    .filter((x) => x.se && x.se.amplitude >= 4);

  const cell = (v) => {
    if (v == null) return 'var(--sunken)';
    const k = Math.min(Math.abs(v) / 6, 1);
    if (Math.abs(v) < 0.4) return 'var(--flat-bg)';
    return `color-mix(in oklab, ${v > 0 ? 'var(--up)' : 'var(--down)'} ${Math.round(14 + k * 50)}%, var(--surface))`;
  };
  const grid = `<div class="cal-grid" role="table" aria-label="${esc(t('Odchylka cen od průměru podle měsíce'))}">
    <div class="cal-row cal-head" role="row"><span role="columnheader"></span>${Array.from({ length: 12 }, (_, m) => `<span role="columnheader" class="${m === now ? 'now' : ''}">${esc(monthName(m, 'short'))}</span>`).join('')}</div>
    ${withSeason
      .map((c) => `<div class="cal-row" role="row"><a role="rowheader" class="cal-cat" href="${catLink(c.id)}">${esc(catName(c))}</a>${seasons[c.id].profile.map((v, m) => `<button type="button" role="cell" class="cal-cell ${m === sel ? 'sel' : ''}" data-action="cal-month" data-m="${m}" style="background:${cell(v)}" aria-label="${esc(`${catName(c)}, ${monthName(m)}: ${pct(v)}`)}" data-tip="${esc(`${catName(c)} · ${monthName(m)}: ${v == null ? '—' : pct(v)} ${t('proti průměru')}`)}">${m === seasons[c.id].bestMonth ? '★' : ''}</button>`).join('')}</div>`)
      .join('')}
    <div class="heat-legend"><span><i style="background:${cell(-6)}"></i>${t('levněji než průměr')}</span><span><i style="background:var(--flat-bg)"></i>${t('průměr')}</span><span><i style="background:${cell(6)}"></i>${t('dráž než průměr')}</span><span>★ ${t('nejlevnější měsíc odvětví')}</span></div>
  </div>`;

  const ev = (e) => (lang() === 'en' ? { title: e.en, text: e.textEn } : e);
  const detail = (m) => {
    const events = EVENTS.filter((e) => e.m === m);
    const cheap = withSeason.filter((c) => seasons[c.id].bestMonth === m);
    const pricey = withSeason.filter((c) => seasons[c.id].worstMonth === m);
    const prods = products.filter((x) => x.se.bestMonth === m).sort((a, b) => b.se.amplitude - a.se.amplitude).slice(0, 8);
    const avoid = products.filter((x) => x.se.worstMonth === m).sort((a, b) => b.se.amplitude - a.se.amplitude).slice(0, 5);
    const block = (title, html) => (html ? `<div class="cal-block"><h3>${title}</h3>${html}</div>` : '');
    return `<div class="cal-detail" id="cal-detail" aria-live="polite">
      <div class="cal-detail-head"><h2>${esc(monthName(m))}${m === now ? ` <span class="pill">${t('teď')}</span>` : ''}</h2>
        <span class="cal-nav"><button type="button" class="icon-btn solid sm" data-action="cal-step" data-d="-1" aria-label="${esc(t('Předchozí měsíc'))}"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 6l-6 6 6 6"/></svg></button><button type="button" class="icon-btn solid sm" data-action="cal-step" data-d="1" aria-label="${esc(t('Další měsíc'))}"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 6l6 6-6 6"/></svg></button></span></div>
      <div class="cal-blocks">
        ${block(t('Akce a sezóny'), events.length ? `<ul class="ev-list">${events.map((e) => `<li class="${e.pricey ? 'pricey' : ''}"><b>${esc(ev(e).title)}</b><span>${esc(ev(e).text)}</span><span class="ev-cats">${e.cats.map((id) => `<a class="chip-sm" href="${catLink(id)}">${esc(catName(categoryById(id)))}</a>`).join('')}</span></li>`).join('')}</ul>` : `<p class="empty">${t('Žádná velká akce, ceny se řídí hlavně sezónností.')}</p>`)}
        ${block(t('Nejlevnější odvětví'), cheap.length ? `<ul class="list">${cheap.map((c) => `<li><a class="item" href="${catLink(c.id)}"><span class="nm">${esc(catName(c))}</span><span class="val chg-down">${pct(seasons[c.id].bestPct)}</span><span class="sub">${t('proti ročnímu průměru')}</span></a></li>`).join('')}</ul>` : '')}
        ${block(t('Produkty, které jsou teď nejlevnější'), prods.length ? `<ul class="list">${prods.map((x) => `<li data-pid="${esc(x.p.id)}"><a class="item" href="${productLink(x.p.id)}"><span class="nm">${esc(x.p.name)}</span><span class="val chg-down">${pct(x.se.bestPct)}${scoreBadge(insight(x.p).score, { tip: false })}</span><span class="sub">${esc(catName(categoryById(x.p.category)))}, ${t('teď')} ${money(sum(x.p).price, x.p.unit)}</span></a></li>`).join('')}</ul>` : '')}
        ${block(t('Raději nekupuj'), pricey.length || avoid.length ? `<ul class="list">${pricey.map((c) => `<li><a class="item" href="${catLink(c.id)}"><span class="nm">${esc(catName(c))}</span><span class="val chg-up">${pct(seasons[c.id].worstPct)}</span><span class="sub">${t('nejdražší měsíc odvětví')}</span></a></li>`).join('')}${avoid.map((x) => `<li><a class="item" href="${productLink(x.p.id)}"><span class="nm">${esc(x.p.name)}</span><span class="val chg-up">${pct(x.se.worstPct)}</span><span class="sub">${t('nejdražší měsíc produktu')}</span></a></li>`).join('')}</ul>` : '')}
      </div>
    </div>`;
  };

  const months = `<div class="month-strip" role="tablist" aria-label="${esc(t('Měsíce'))}">${Array.from({ length: 12 }, (_, m) => {
    const n = EVENTS.filter((e) => e.m === m).length + withSeason.filter((c) => seasons[c.id].bestMonth === m).length;
    return `<button type="button" role="tab" class="month ${m === now ? 'now' : ''}" data-action="cal-month" data-m="${m}" aria-selected="${m === sel}" tabindex="${m === sel ? 0 : -1}"><span>${esc(monthName(m, 'short'))}</span>${n ? `<i>${n}</i>` : ''}</button>`;
  }).join('')}</div>`;

  main.innerHTML =
    hero({
      crumb: `<a href="${link('/')}">${t('Přehled')}</a>`,
      title: t('Nákupní kalendář'),
      lead: t('Kdy je co v roce nejlevněji: sezónnost z historie cen a známé slevové akce v Česku.'),
      below: `<a class="chip-link" href="${link('/kalendar?mesic=' + (now + 1))}">${ICON.calendar}${t('Tento měsíc')}</a>`,
    }) +
    sheet(`
    <section class="section">${months}<div id="cal-slot">${detail(sel)}</div></section>
    <section class="section"><div class="section-head"><div><h2>${t('Celý rok podle odvětví')}</h2><p>${t('Zelená = v tomto měsíci bývá levněji než průměr, červená = dráž. Klikni na měsíc pro detail.')}</p></div></div>
      ${withSeason.length ? grid : `<p class="empty">${t('Na sezónnost je potřeba aspoň rok historie cen.')}</p>`}
    </section>`);

  const strip = main.querySelector('.month-strip');
  const show = (m, focus = false) => {
    const dir = m > sel ? 1 : -1;
    sel = (m + 12) % 12;
    setQuery({ mesic: sel + 1 });
    strip.querySelectorAll('[role=tab]').forEach((b) => {
      const on = +b.dataset.m === sel;
      b.setAttribute('aria-selected', on);
      b.tabIndex = on ? 0 : -1;
      if (on && focus) b.focus();
      if (on) b.scrollIntoView({ block: 'nearest', inline: 'center', behavior: reducedMotion() ? 'auto' : 'smooth' });
    });
    main.querySelectorAll('.cal-cell').forEach((c) => c.classList.toggle('sel', +c.dataset.m === sel));
    const slot = main.querySelector('#cal-slot');
    slot.innerHTML = detail(sel);
    if (!reducedMotion()) slot.firstElementChild.animate([{ opacity: 0, transform: `translateX(${dir * 18}px)` }, { opacity: 1, transform: 'none' }], { duration: 260, easing: 'cubic-bezier(.2,.7,.2,1)' });
  };
  strip.addEventListener('keydown', (e) => {
    if (e.key !== 'ArrowRight' && e.key !== 'ArrowLeft') return;
    e.preventDefault();
    show(sel + (e.key === 'ArrowRight' ? 1 : -1), true);
  });
  actions({
    'cal-month': (el) => show(+el.dataset.m),
    'cal-step': (el) => show(sel + +el.dataset.d),
  });
  return {
    update(q) {
      const m = (parseInt(q.get('mesic'), 10) || now + 1) - 1;
      if (m !== sel) show(m);
    },
  };
}

return { EVENTS, renderCalendar };
})();

// ----- js/views/deals.js -----
const __js_views_deals_js = (() => {
// Pozor na tyto akce: podezřelé (nafouknuté) slevy a slevy, které nejsou nejnižší cenou za 30 dní.
const { S, categoryById, catName, productLink, link, esc, pct, money, sum, dateFmt, hero, sheet, insight, scoreBadge, ICON, CATEGORIES, conv, unitOf, nf, setQuery } = __js_core_js;
const { actions, accordion } = __js_ui_js;
const { lineChart, T } = __js_chart_js;
const { t } = __js_i18n_js;

function renderDeals(main, query = new URLSearchParams()) {
  document.title = `${t('Pozor na tyto akce')} – BuyWise`;
  const cat = query.get('odvetvi') || '';
  const all = S.data.products
    .filter((p) => p.active !== false && categoryById(p.category)?.kind === 'spotrebni' && (!cat || p.category === cat))
    .map((p) => ({ p, s: sum(p), i: insight(p) }));
  // 1) Nafouknutá sleva: cena byla zvednuta a pak „zlevněna“ zpátky.
  const fake = all.filter((x) => x.i.discount?.suspicious).sort((a, b) => (b.i.discount.peak / b.i.discount.prior) - (a.i.discount.peak / a.i.discount.prior));
  // 2) Inzerovaná sleva, ale před 30 dny bylo levněji (směrnice Omnibus: sleva se má počítat z nejnižší ceny za 30 dní).
  const notLowest = all.filter((x) => !x.i.discount?.suspicious && x.i.discount?.lowest30 != null && x.s.price > x.i.discount.lowest30 * 1.03 && ((x.p.discount > 0) || (x.s.ch7 != null && x.s.ch7 < -2)));
  // 3) Rychlé zdražení za týden (často před akcí)
  const jumps = all.filter((x) => x.s.ch7 != null && x.s.ch7 >= 6).sort((a, b) => b.s.ch7 - a.s.ch7).slice(0, 8);
  // 4) Opravdu dobré ceny: nejnižší za 30 dní a skóre Kup teď
  const real = all.filter((x) => x.i.score?.tone === 'buy' && x.i.discount?.lowest30 != null && x.s.price <= x.i.discount.lowest30 * 1.005).sort((a, b) => b.i.score.score - a.i.score.score).slice(0, 8);

  const card = (x, i) => {
    const d = x.i.discount;
    const u = x.p.unit || 'Kč';
    return `<li class="deal" data-pid="${esc(x.p.id)}">
      <div class="deal-head"><a class="nm" href="${productLink(x.p.id)}" data-prefetch="${esc(x.p.id)}">${esc(x.p.name)}</a><span class="sub">${esc(catName(categoryById(x.p.category)))}</span></div>
      <div class="deal-chart chart" id="dc${i}" aria-hidden="true"></div>
      <dl class="deal-facts">
        <div><dt>${t('před zdražením')}</dt><dd>${money(d.prior, u)}</dd></div>
        <div><dt>${t('zdraženo na')}</dt><dd class="chg-up">${money(d.peak, u)}</dd><small>${dateFmt(d.peakDate)}</small></div>
        <div><dt>${t('„sleva“ na')}</dt><dd>${money(x.s.price, u)}</dd><small class="chg-down">${pct(d.discountFromPeak)} ${t('od špičky')}</small></div>
        <div><dt>${t('skutečně')}</dt><dd class="${x.s.price > d.prior ? 'chg-up' : ''}">${pct(((x.s.price - d.prior) / d.prior) * 100)}</dd><small>${t('proti ceně před zdražením')}</small></div>
      </dl>
    </li>`;
  };
  const item = (x, val, small) => `<li data-pid="${esc(x.p.id)}"><a class="item" href="${productLink(x.p.id)}"><span class="nm">${esc(x.p.name)}</span><span class="val">${val}${small ? `<small>${small}</small>` : ''}</span><span class="sub">${esc(catName(categoryById(x.p.category)))}, ${t('teď')} ${money(x.s.price, x.p.unit)}</span></a></li>`;
  const cats = CATEGORIES.filter((c) => c.kind === 'spotrebni');

  main.innerHTML =
    hero({
      crumb: `<a href="${link('/')}">${t('Přehled')}</a>`,
      title: t('Pozor na tyto akce'),
      lead: t('Slevy, které nejsou tak výhodné, jak vypadají. Hlídáme zdražení těsně před akcí a nejnižší cenu za posledních 30 dní.'),
      aside: `<dl class="pulse"><div><dt>${t('nafouknuté slevy')}</dt><dd class="up">${fake.length}</dd></div><div><dt>${t('není nejnižší cena')}</dt><dd>${notLowest.length}</dd></div><div><dt>${t('opravdu dobrá cena')}</dt><dd class="down">${real.length}</dd></div></dl>`,
    }) +
    sheet(`
    <div class="toolbar"><div class="controls"><div class="ctl"><span class="ctl-label">${t('Odvětví')}</span><span class="seg" role="group">${[['', t('Vše')], ...cats.map((c) => [c.id, catName(c)])].map(([k, l]) => `<button type="button" data-action="d-cat" data-v="${k}" aria-pressed="${cat === k}">${esc(l)}</button>`).join('')}</span></div></div></div>
    <section class="section"><div class="section-head"><div><h2>${ICON.shield}${t('Nafouknuté slevy')}</h2><p>${t('Cena byla v posledních dvou měsících zvednuta o 8 % a víc a pak „zlevněna“ zpátky.')}</p></div></div>
      ${fake.length ? `<ul class="deals">${fake.map(card).join('')}</ul>` : `<p class="empty">${t('Teď nevidíme žádnou nafouknutou slevu. Dobrá zpráva.')}</p>`}
    </section>
    <section class="section cols">
      <div><div class="section-head"><div><h2>${t('Sleva, ale ne nejnižší cena')}</h2><p>${t('Před 30 dny bylo levněji, než je teď „akční“ cena.')}</p></div></div>
        ${notLowest.length ? `<ul class="list">${notLowest.map((x) => item(x, `<span class="chg-up">+${nf(1).format(((x.s.price - x.i.discount.lowest30) / x.i.discount.lowest30) * 100)} %</span>`, `${t('minimum 30 dní')} ${money(x.i.discount.lowest30, x.p.unit)}`)).join('')}</ul>` : `<p class="empty">${t('Nic takového teď nevidíme.')}</p>`}</div>
      <div><div class="section-head"><div><h2>${t('Zdražilo za týden')}</h2><p>${t('Prudké zdražení bývá předzvěstí „slevové“ akce')}</p></div></div>
        ${jumps.length ? `<ul class="list">${jumps.map((x) => item(x, `<span class="chg-up">${pct(x.s.ch7)}</span>`, t('za 7 dní'))).join('')}</ul>` : `<p class="empty">${t('Za poslední týden nic prudce nezdražilo.')}</p>`}</div>
    </section>
    <section class="section"><div class="section-head"><div><h2>${t('Tohle jsou opravdu dobré ceny')}</h2><p>${t('Nejnižší cena za 30 dní a skóre Kup teď')}</p></div></div>
      ${real.length ? `<ul class="list">${real.map((x) => item(x, scoreBadge(x.i.score, { tip: false }), t('nejnižší za 30 dní'))).join('')}</ul>` : `<p class="empty">${t('Teď nic nesplňuje obě podmínky.')}</p>`}
    </section>
    <div class="acc-list section">
      ${accordion({ id: 'acc-omnibus', title: t('Jak poznat falešnou slevu'), body: `<ul class="tips">
        <li>${t('Od roku 2023 musí obchod u slevy uvádět nejnižší cenu za posledních 30 dní. Sleva se má počítat z ní, ne z „doporučené“ ceny.')}</li>
        <li>${t('Když cena týden před akcí vyskočí nahoru, sleva je jen návrat k původní ceně.')}</li>
        <li>${t('Porovnej víc prodejců – na detailu produktu vidíš jejich ceny i odhad.')}</li>
        <li>${t('Nastav si hlídač nebo cílovou cenu v seznamu přání a nech BuyWise čekat za tebe.')}</li></ul>` })}
    </div>`);

  // Malé grafy: posledních 90 dní, zvýrazněná špička zdražení.
  const draw = () =>
    fake.forEach((x, i) => {
      const el = main.querySelector('#dc' + i);
      if (!el) return;
      const u = x.p.unit || 'Kč';
      lineChart(el, {
        series: [{ name: x.p.name, color: 'var(--up)', data: x.s.history.slice(-90).map((h) => ({ t: T(h.d), v: conv(h.p, u).v })), width: 2 }],
        height: 120,
        valFmt: (v) => `${nf(Math.abs(v) >= 100 ? 0 : 2, 0).format(v)} ${unitOf(u)}`,
        label: t('Graf vývoje ceny'),
      });
    });
  draw();
  S.redraw = draw;
  actions({
    'd-cat': (el) => {
      setQuery({ odvetvi: el.dataset.v || null });
      renderDeals(main, new URLSearchParams(el.dataset.v ? { odvetvi: el.dataset.v } : {}));
    },
  });
  return true;
}

return { renderDeals };
})();

// ----- js/views/budget.js -----
const __js_views_budget_js = (() => {
// Rozpočtový poradce: „Mám 30 000 Kč na notebook“ → co se do rozpočtu vejde a kdy to koupit nejlevněji.
// Stav formuláře je v adrese (?odvetvi=&castka=&kdy=), takže se dá výsledek poslat odkazem.
const { CATEGORIES, categoryById, catName, byCat, sum, money, esc, productLink, link, hero, sheet, insight, scoreBadge, monthName, conv, unitOf, setQuery, ICON } = __js_core_js;
const { actions, reducedMotion } = __js_ui_js;
const { budgetPlan } = __lib_analytics_js;
const { wishButton } = __js_user_js;
const { t, tk, nProducts } = __js_i18n_js;

const HORIZONS = [['hned', 'Potřebuju hned'], ['mesic', 'Do měsíce'], ['ctvrtleti', 'Do 3 měsíců'], ['kdykoli', 'Nespěchám']];

function renderBudget(main, query = new URLSearchParams()) {
  document.title = `${t('Rozpočtový poradce')} – BuyWise`;
  const cats = CATEGORIES.filter((c) => c.kind === 'spotrebni');
  const st = {
    cat: categoryById(query.get('odvetvi'))?.kind === 'spotrebni' ? query.get('odvetvi') : '',
    amount: query.get('castka') || '',
    when: HORIZONS.some(([k]) => k === query.get('kdy')) ? query.get('kdy') : 'kdykoli',
  };
  const cur = unitOf('Kč');

  main.innerHTML =
    hero({
      crumb: `<a href="${link('/')}">${t('Přehled')}</a>`,
      title: t('Rozpočtový poradce'),
      lead: t('Řekni, kolik chceš utratit a kdy to potřebuješ. Poradíme, co se do rozpočtu vejde a kdy to koupit nejlevněji.'),
    }) +
    sheet(`
    <form class="card budget-form" id="bform" novalidate>
      <p class="budget-sentence">
        <span>${t('Mám')}</span>
        <label class="inline-field"><span class="sr-only">${t('Částka')}</span><input id="b-amount" type="number" inputmode="decimal" min="1" step="any" required value="${esc(st.amount)}" placeholder="30000"><b>${esc(cur)}</b></label>
        <span>${t('na')}</span>
        <label class="inline-field"><span class="sr-only">${t('Odvětví')}</span><select id="b-cat"><option value="">${t('cokoli')}</option>${cats.map((c) => `<option value="${c.id}" ${st.cat === c.id ? 'selected' : ''}>${esc(catName(c).toLowerCase())}</option>`).join('')}</select></label>
      </p>
      <div class="ctl"><span class="ctl-label">${t('Kdy to potřebuješ')}</span><span class="seg" role="group" aria-label="${esc(t('Kdy to potřebuješ'))}">${HORIZONS.map(([k, l]) => `<button type="button" data-action="b-when" data-v="${k}" aria-pressed="${st.when === k}">${t(l)}</button>`).join('')}</span></div>
      <button class="btn" type="submit">${ICON.wallet}${t('Poradit')}</button>
    </form>
    <section class="section" id="b-out" aria-live="polite"></section>`);

  const out = main.querySelector('#b-out');
  const run = (animate) => {
    const raw = parseFloat(String(st.amount).replace(',', '.'));
    if (!Number.isFinite(raw) || raw <= 0) {
      out.innerHTML = `<div class="empty-state small">${ICON.wallet}<p>${t('Zadej částku a vyber odvětví. Třeba 30 000 Kč na elektro, nespěchám.')}</p></div>`;
      return;
    }
    const budget = raw / (conv(1, 'Kč').v || 1); // přepočet zpět na Kč
    const pool = (st.cat ? byCat(st.cat) : cats.flatMap((c) => byCat(c.id))).filter((p) => !p.free && String(p.unit || 'Kč').startsWith('Kč'));
    const items = pool.map((p) => {
      const s = sum(p);
      const i = insight(p);
      return { id: p.id, p, price: s.price, score: i.score, forecast: s.forecast, season: i.season };
    });
    const plan = budgetPlan(items, budget, st.when).slice(0, 12);
    const over = pool.length - budgetPlan(items, budget, 'kdykoli').length;
    const planText = (x) => {
      const u = x.p.unit || 'Kč';
      if (x.plan.type === 'now') return `<b>${t('Kup teď')}</b> ${t('za {p}', { p: money(x.plan.price, u) })}`;
      if (x.plan.type === 'days') return `<b>${t('Počkej do 30 dní')}</b> – ${t('odhad {p}', { p: money(x.plan.price, u) })}`;
      return `<b>${t('Kup v měsíci {m}', { m: monthName(x.plan.month) })}</b> – ${t('obvykle kolem {p}', { p: money(x.plan.price, u) })}`;
    };
    out.innerHTML = plan.length

// ---------- Vyhledávání ----------
function bindSearch() {
  const q = $header.querySelector('#q');
  const res = $header.querySelector('#qres');
  let active = -1;
  const norm = (s) => String(s).normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
  const close = () => {
    res.hidden = true;
    q.setAttribute('aria-expanded', 'false');
    q.removeAttribute('aria-activedescendant');
  };
  const search = () => {
    const term = norm(q.value.trim());
    active = -1;
    if (term.length < 2) return close();
    const words = term.split(/\s+/);
    const hits = S.data.products
      .map((p) => {
        const hay = norm(`${p.name} ${p.subtitle || ''} ${catName(categoryById(p.category))}`);
        if (!words.every((w) => hay.includes(w))) return null;
        return { p, score: (norm(p.name).startsWith(words[0]) ? 0 : 1) + (p.rank ? 0 : 2) + (p.active === false ? 3 : 0) };
      })
      .filter(Boolean)
      .sort((a, b) => a.score - b.score || (a.p.rank ?? 99) - (b.p.rank ?? 99))
      .slice(0, 8);
    res.innerHTML = hits.length
      ? hits
          .map(({ p }, i) => {
            const s = sum(p);
            return `<a role="option" id="qo${i}" href="${productLink(p.id)}" data-prefetch="${esc(p.id)}"><span class="q-tag tag ${p.rank ? '' : 'dim'}">${p.rank || '–'}</span><span class="q-txt"><span class="nm">${esc(p.name)}</span><span class="muted small">${esc(catName(categoryById(p.category)))}</span></span><span class="pr">${priceText(p, s)}</span></a>`;
          })
          .join('')
      : `<p class="empty">${t('Nic nenalezeno.')}</p>`;
    res.hidden = false;
    q.setAttribute('aria-expanded', 'true');
  };
  q.addEventListener('input', search);
  q.addEventListener('focus', search);
  q.addEventListener('keydown', (e) => {
    const opts = [...res.querySelectorAll('[role=option]')];
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
      e.preventDefault();
      if (!opts.length) return;
      active = (active + (e.key === 'ArrowDown' ? 1 : -1) + opts.length) % opts.length;
      opts.forEach((o, i) => o.setAttribute('aria-selected', i === active));
      q.setAttribute('aria-activedescendant', opts[active].id);
      opts[active].scrollIntoView({ block: 'nearest' });
    } else if (e.key === 'Enter') {
      const o = opts[active] || opts[0];
      if (o) {
        e.preventDefault();
        close();
        q.value = '';
        q.blur();
        navigate(o.getAttribute('href').replace(/^#/, ''));
      }
    } else if (e.key === 'Escape') {
      close();
      q.blur();
    }
  });
}

// ---------- Router ----------
function parseRoute() {
  const raw = currentPath();
  const [pathPart, qs = ''] = raw.split('?');
  const query = new URLSearchParams(qs);
  const parts = pathPart.split('/').filter(Boolean).map(decodeURIComponent);
  const [a, b] = parts;
  const base = { path: pathPart, query };
  if (a === 'kategorie' || a === 'k') return { ...base, name: 'cat', cat: b };
  if (a === 'produkt' || a === 'p') return { ...base, name: 'product', id: b, cat: productById(b)?.category };
  if (a === 'porovnat') return { ...base, name: 'compare' };
  if (a === 'oblibene') return { ...base, name: 'fav' };
  if (a === 'portfolio') return { ...base, name: 'portfolio' };
  if (a === 'stav') return { ...base, name: 'status' };
  if (a === 'prani') return { ...base, name: 'wish' };
  if (a === 'kalendar') return { ...base, name: 'calendar' };
  if (a === 'pozor') return { ...base, name: 'deals' };
  if (a === 'rozpocet') return { ...base, name: 'budget' };
  if (a === 'admin') return { ...base, name: 'admin' };
  if (!a) return { ...base, name: 'home' };
  return { ...base, name: 'notfound' };
}

// Pozadí podle sekce.
function backdropFor(r) {
  if (r.name === 'cat' && categoryById(r.cat)) return setBackdrop('cat:' + r.cat, groupOf(r.cat), () => categoryPhotos(r.cat));
  if (r.name === 'product') {
    const p = productById(r.id);
    if (p) return setBackdrop('p:' + p.id, groupOf(p.category), () => productPhotos(p));
  }
  if (r.name === 'compare') {
    const first = productById(cmp.list()[0]);
    if (first) return setBackdrop('p:' + first.id, groupOf(first.category), () => productPhotos(first));
  }
  if (r.name === 'portfolio') return setBackdrop('cat:komodity', 'investice', () => categoryPhotos('komodity'));
  if (r.name === 'wish') {
    const first = productById(wish.list()[0]?.id);
    if (first) return setBackdrop('p:' + first.id, groupOf(first.category), () => productPhotos(first));
  }
  if (r.name === 'deals') return setBackdrop('cat:elektro', 'nakupy', () => categoryPhotos('elektro'));
  if (r.name === 'budget') {
    const c = r.query.get('odvetvi') && categoryById(r.query.get('odvetvi')) ? r.query.get('odvetvi') : 'elektro';
    return setBackdrop('cat:' + c, groupOf(c), () => categoryPhotos(c));
  }
  if (r.name === 'calendar') return setBackdrop('cat:dovolene', 'domacnost', () => categoryPhotos('dovolene'));
  return setBackdrop('home', 'nakupy', homePhotos);
}

let last = { path: null, name: null, view: null, productId: null };

async function render(r) {
  resetActions();
  S.redraw = null;
  hideTip();
  hideChartTip();
  let ok = true;
  let view = null;
  if (r.name === 'cat') view = renderCategory($main, r.cat, r.query);
  else if (r.name === 'product') view = await renderProduct($main, r.id);
  else if (r.name === 'compare') view = renderCompare($main, r.query);
  else if (r.name === 'fav') view = renderFavorites($main);
  else if (r.name === 'portfolio') view = renderPortfolio($main, r.query);
  else if (r.name === 'status') view = await renderStatus($main);
  else if (r.name === 'admin') view = await renderAdmin($main);
  else if (r.name === 'wish') view = renderWishlist($main);
  else if (r.name === 'calendar') view = renderCalendar($main, r.query);
  else if (r.name === 'deals') view = renderDeals($main, r.query);
  else if (r.name === 'budget') view = renderBudget($main, r.query);
  else if (r.name === 'home') view = renderHome($main) ?? true;
  else ok = false;
  if (!view) ok = false;
  if (!ok) {
    $main.innerHTML = `<section class="hero"><div class="hero-in"><div class="hero-main"><h1 class="hero-title" tabindex="-1">${t('Tahle stránka neexistuje')}</h1><p class="hero-lead">${t('Produkt mohl vypadnout z žebříčku.')} <a href="${link('/')}">${t('Zpět na přehled')}</a>.</p></div></div><p class="credit" id="photo-credit" hidden></p></section>`;
  }
  // Při návratu z detailu produktu „přistane“ cenovka zpátky na svůj řádek.
  if (last.productId && r.name !== 'product') {
    const row = $main.querySelector(`[data-pid="${CSS.escape(last.productId)}"]`);
    if (row) {
      shareElement(row.querySelector('.tag'), 'pm-tag');
      shareElement(row.querySelector('.nm'), 'pm-title');
    }
  }
  refreshCredit();
  return typeof view === 'object' ? view : null;
}

function clearSharedNames() {
  document.querySelectorAll('[style*="view-transition-name"]').forEach((el) => {
    if (!el.closest('.hero-title') && !el.classList.contains('hero-tag')) el.style.viewTransitionName = '';
  });
}

async function route(opts = {}) {
  const r = parseRoute();
  const navOpts = S.navOpts || {};
  S.navOpts = {};
  if (drawerOpen() && !opts.keepDrawer && !opts.soft) closeDrawer({ keepFocus: true });
  // Jen jiné parametry na stejné stránce – pohled se aktualizuje bez nového přechodu.
  if (!opts.soft && r.path === last.path && last.view?.update) {
    last.view.update(r.query);
    return;
  }
  const samePage = r.path === last.path;
  const doRender = async () => {
    renderHeader(r);
    renderBanner();
    last.view = await render(r);
  };
  if (opts.soft || !last.name) await doRender();
  else await transition(doRender, { kind: navOpts.back ? 'back' : 'page' });
  clearSharedNames();
  renderTray(r);
  backdropFor(r);
  if (r.name === 'product') last.productId = r.id;
  else if (r.name !== 'cat' && r.name !== 'home') last.productId = null;
  // Scroll a fokus
  if (!opts.soft && !samePage) {
    const y = navOpts.restore ? savedScroll() : null;
    window.scrollTo({ top: y ?? 0, behavior: 'instant' });
    const h1 = $main.querySelector('h1');
    if (h1 && last.name) h1.focus({ preventScroll: true });
    announce(document.title);
  }
  last.path = r.path;
  last.name = r.name;
  // Úvodní prohlídka při první návštěvě přehledu.
  if (r.name === 'home' && !tourDone() && !opts.soft) setTimeout(() => parseRoute().name === 'home' && !drawerOpen() && !tourDone() && startTour(homeSteps()), 1200);
}

// ---------- Interní odkazy, kliknutí mimo ----------
function onLink(href, a, e) {
  if (S.hash) {
    if (href.startsWith('#/')) {
      e.preventDefault();
      prepareShared(a);
      navigate(href.slice(1));
    }
    return;
  }
  if (href === '#hlidac' || (href.startsWith('#') && href.length > 1)) {
    e.preventDefault();
    document.getElementById(href.slice(1))?.scrollIntoView({ behavior: reducedMotion() ? 'auto' : 'smooth' });
    return;
  }
  if (!href.startsWith('/') || href.startsWith('//') || href.startsWith('/api/')) return;
  e.preventDefault();
  prepareShared(a);
  navigate(href);
}

// Odkaz z řádku žebříčku na produkt: cenovka a název se „přenesou“ do detailu.
function prepareShared(a) {
  const row = a.closest('[data-pid]');
  if (!row || !/\/produkt\//.test(a.getAttribute('href'))) return;
  shareElement(row.querySelector('.tag'), 'pm-tag');
  shareElement(row.querySelector('.nm'), 'pm-title');
}

function onOutside(e) {
  if (!e.target.closest('.search')) {
    const r = document.getElementById('qres');
    if (r && !r.hidden) {
      r.hidden = true;
      document.getElementById('q')?.setAttribute('aria-expanded', 'false');
    }
  }
}

// ---------- Start ----------
(async function start() {
  applyTheme();
  document.documentElement.dataset.motion = store.get('motion', 'on');
  document.documentElement.lang = lang();
  if ('scrollRestoration' in history) history.scrollRestoration = 'manual';
  if (!history.state?.k) history.replaceState({ k: Date.now().toString(36) }, '', location.href);
  $main.innerHTML = `<section class="hero"><div class="hero-in"><div class="hero-main"><p class="hero-lead">${t('Načítám data…')}</p></div></div></section>`;
  if (!S.hash && location.hash.startsWith('#/')) history.replaceState(history.state, '', location.hash.slice(1));
  installClickHandler({ onLink, onOutside });
  // Nenačtený náhled produktu se skryje (místo inline onerror, které by zakazovala Content-Security-Policy).
  document.addEventListener('error', (e) => e.target?.matches?.('img.thumb, img.p-thumb') && e.target.remove(), true);
  installTooltips();

  const [data, config] = await Promise.all([loadData(), S.standalone ? null : loadConfig()]);
  S.data = data;
  S.config = config;
  computeSeasons();

  window.addEventListener(S.hash ? 'hashchange' : 'popstate', () => {
    S.navOpts = { back: true, restore: true };
    route();
  });
  window.addEventListener('pm-route', () => route());
  window.addEventListener('pm-user', () => {
    const r = parseRoute();
    renderHeader(r);
    renderTray(r);
    refreshSettings();
    if (r.name === 'fav' || r.name === 'portfolio' || r.name === 'wish') route({ soft: true });
  });
  window.addEventListener('beforeinstallprompt', (e) => {
    e.preventDefault();
    installPrompt = e;
  });
  // Hlavička: průhledná nad fotkou, po odscrollování skleněná.
  const onScroll = () => document.documentElement.classList.toggle('scrolled', window.scrollY > 24);
  window.addEventListener('scroll', onScroll, { passive: true });
  onScroll();
  let resizeTimer;
  window.addEventListener('resize', () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(() => S.redraw && S.redraw(), 150);
  });
  window.addEventListener('pagehide', saveScroll);
  // Klávesa „/“ skočí do hledání.
  document.addEventListener('keydown', (e) => {
    if (e.key === '/' && !e.target.closest('input, textarea, select, [contenteditable]')) {
      e.preventDefault();
      document.getElementById('q')?.focus();
    }
  });
  // Přednačtení detailu produktu při najetí myší (plná historie se stáhne dopředu).
  document.addEventListener('pointerover', (e) => {
    const el = e.target.closest?.('[data-prefetch]');
    if (el && S.data.mode === 'live') fullProduct(el.dataset.prefetch);
  });

  await route();
  checkLocalAlerts();
  checkWishes();
  initAuth();
  if (!S.hash && 'serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js').catch(() => {});
  if (!S.hash && !/^(localhost|127\.|\[::1\])/.test(location.hostname)) {
    const s = document.createElement('script');
    s.defer = true;
    s.src = '/_vercel/insights/script.js';
    document.head.appendChild(s);
  }
})();

return { TOOLS };
})();
</script>
