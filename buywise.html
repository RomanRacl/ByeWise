function matchFeedItem(product, items, lastPrice = null) {
  prepareFeed(items);
  const sane = (it) => !lastPrice || (it.price >= lastPrice * 0.45 && it.price <= lastPrice * 2.2);

  if (ean) {
    const hit = items.filter((i) => i.ean && i.ean.replace(/\D/g, '') === String(ean).replace(/\D/g, '') && sane(i));
    if (hit.length) return { ...hit.reduce((a, b) => (b.price < a.price ? b : a)), byEan: true };

  const nameTok = tokens(product.name);
  const want = [...new Set([...nameTok, ...tokens(product.subtitle || '')])];
  const mine = new Set(want);
  const nums = want.filter((t) => /\d/.test(t));
  let best = null;
  for (const it of items) {
    const have = it._tok;
    if (!nameTok.every((t) => have.has(t))) continue;
    if (!nums.every((n) => have.has(n))) continue;
    let bad = false;
    for (const t of have) {
      if ((ACCESSORY.has(t) || VARIANT.has(t)) && !mine.has(t)) {
        bad = true;
        break;
      }
    }
    if (bad || !sane(it)) continue;
    const cover = want.filter((t) => have.has(t)).length / want.length;
    if (cover < 0.6) continue;
    // Méně slov navíc = přesnější shoda; při shodě levnější nabídka.
    const extra = have.size - want.filter((t) => have.has(t)).length;
    const score = cover * 10 - extra * 0.2;
    if (!best || score > best.score || (score === best.score && it.price < best.item.price)) best = { item: it, score };
  }
  return best ? best.item : null;
}

// rules: [{ domain: 'alza.cz', template: '{url}?idp=123' }] – {url} nebo {url_enc}
function affiliate(url, rules = []) {
  if (!url) return url;
  let host = '';
  try {
    host = new URL(url).hostname.replace(/^www\./, '');
  } catch {
    return url;
  }
  const rule = rules.find((r) => r.domain && (host === r.domain || host.endsWith('.' + r.domain)));
  if (!rule || !rule.template) return url;
  return rule.template.replace('{url_enc}', encodeURIComponent(url)).replace('{url}', url);
}

function parseAffiliateRules(text) {
  return String(text || '')
    .split(/\r?\n/)
    .map((l) => l.split('|').map((x) => x.trim()))
    .filter(([d, t]) => d && t)
    .map(([domain, template]) => ({ domain: domain.replace(/^www\./, ''), template }));
}

const __js_i18n_js = (() => {
// Překlady: klíčem je český text, angličtina je ve slovníku EN. Chybějící překlad zobrazí češtinu.
const { EN } = __js_en_js;

let LANG = 'cs';
try {
  LANG = localStorage.getItem('pm-lang')?.replace(/"/g, '') || ((navigator.language || '').startsWith('cs') || (navigator.language || '').startsWith('sk') ? 'cs' : 'en');
} catch {}
if (LANG !== 'en') LANG = 'cs';

const lang = () => LANG;
const locale = () => (LANG === 'en' ? 'en-GB' : 'cs-CZ');

function setLang(l) {
  LANG = l === 'en' ? 'en' : 'cs';
  try {
    localStorage.setItem('pm-lang', JSON.stringify(LANG));
  } catch {}
  document.documentElement.lang = LANG;
}

const fmtParam = (v) =>
  typeof v === 'number' ? new Intl.NumberFormat(locale(), { maximumFractionDigits: Math.abs(v) >= 100 ? 0 : 1, minimumFractionDigits: Math.abs(v) >= 100 || Number.isInteger(v) ? 0 : 1 }).format(v) : v;

function t(key, params) {
  let s = LANG === 'en' ? EN[key] ?? key : key;
  if (params) s = s.replace(/\{(\w+)\}/g, (m, k) => (params[k] === undefined ? m : fmtParam(params[k])));
  return s;
}

// Text z analytiky ve tvaru { key, params }.
const tk = (o) => (o ? t(o.key, o.params) : '');

// Počet produktů se správným tvarem: 1 produkt, 2–4 produkty, 5 produktů / 1 product, 2 products.
function nProducts(n) {
  if (LANG === 'en') return `${n} ${n === 1 ? 'product' : 'products'}`;
  return `${n} ${n === 1 ? 'produkt' : n >= 2 && n <= 4 ? 'produkty' : 'produktů'}`;
}

return { lang, locale, setLang, t, tk, nProducts };
})();

const __js_core_js = (() => {
// Společný stav, formátování, odkazy a drobné UI pomůcky.
const { CATEGORIES, GROUPS, categoryById } = __lib_categories_js;
const { summarize, analyzeFull, buyScore, minMax, discountCheck, seasonality } = __lib_analytics_js;
const { affiliate } = __lib_dataops_js;
const { t, lang, locale } = __js_i18n_js;

const S = {
  data: null, // { mode, meta, settings, products, seasons }
  sum: new Map(),
  full: new Map(),
  config: null,
  user: null, // { uid, email, name } po přihlášení
  profile: null, // uživatelská data ze serveru
  standalone: true, // samostatná HTML verze
  hash: true,
  redraw: null,
};

// ---------- Úložiště v prohlížeči ----------
const store = {
  get(k, d) {
    try {
      const v = localStorage.getItem('pm-' + k);
      return v == null ? d : JSON.parse(v);
    } catch {
      return d;
    }
  },
  set(k, v) {
    try {
      localStorage.setItem('pm-' + k, JSON.stringify(v));
      return true;
    } catch {
      return false;
    }
  },
};

// ---------- Formátování ----------
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
const nf = (d, min = d) => new Intl.NumberFormat(locale(), { maximumFractionDigits: d, minimumFractionDigits: min });
const decimals = (v) => (Math.abs(v) >= 100 ? 0 : Math.abs(v) >= 10 ? 1 : 2);
const compact = (v) => new Intl.NumberFormat(locale(), { notation: 'compact', maximumFractionDigits: Math.abs(v) < 10 ? 2 : 1 }).format(v);

const CURRENCIES = { CZK: 'Kč', EUR: '€', USD: '$' };
const currency = () => store.get('currency', 'CZK');
function rates() {
  return S.data?.meta?.rates || { USD: 21.2, EUR: 24.4 };
}
// Převod částky v Kč do zvolené měny (jen pro jednotky začínající „Kč“).
function conv(v, unit = 'Kč') {
  const cur = currency();
  if (v == null || cur === 'CZK' || !String(unit || 'Kč').startsWith('Kč')) return { v, unit: unit || 'Kč' };
  const r = rates()[cur];
  if (!r) return { v, unit };
  return { v: v / r, unit: String(unit || 'Kč').replace(/^Kč/, CURRENCIES[cur]) };
}
function money(v, unit = 'Kč', noUnit = false) {
  if (v == null || !Number.isFinite(v)) return '—';
  const c = conv(v, unit);
  const n = nf(decimals(c.v), 0).format(c.v);
  if (noUnit) return n;
  return `${n} ${esc(c.unit)}`;
}
const unitOf = (unit) => conv(1, unit).unit;
function pct(v, withSign = true) {
  if (v == null || !Number.isFinite(v)) return '—';
  const s = nf(1).format(Math.abs(v)) + ' %';
  if (!withSign) return s;
  return (v > 0.05 ? '+' : v < -0.05 ? '−' : '') + s;
}
const pctClass = (v) => (v == null ? 'chg-flat' : v > 0.5 ? 'chg-up' : v < -0.5 ? 'chg-down' : 'chg-flat');
const dateFmt = (d, opts = { day: 'numeric', month: 'numeric', year: 'numeric' }) =>
  d ? new Date(d.length === 10 ? d + 'T12:00:00' : d).toLocaleDateString(locale(), opts) : '—';
const monthName = (m, style = 'long') => new Date(Date.UTC(2026, m, 15)).toLocaleDateString(locale(), { month: style });

// ---------- Odvětví ----------
const catName = (c) => (c ? (lang() === 'en' ? c.en : c.name) : '');
const catNote = (c) => (lang() === 'en' ? c.sourceNoteEn : c.sourceNote);
const catPriceLabel = (c) => (lang() === 'en' ? c.priceLabelEn : c.priceLabel);
const catDemandLabel = (c) => (lang() === 'en' ? c.demandLabelEn : c.demandLabel);
const groupName = (g) => (lang() === 'en' ? g.en : g.name);


// ---------- Produkty ----------
function sum(p) {
  if (!S.sum.has(p.id)) {
    const s = summarize(p);
    if (s.ch365 == null && p.stats?.ch365 != null) s.ch365 = p.stats.ch365;
    S.sum.set(p.id, s);
  }
  return S.sum.get(p.id);
}
// Nákupní pohled na produkt: skóre Kup teď / Počkej, roční rozpětí, slevy, sezónnost.
// U lehkých dat (130 dní) se rozpětí, slevy a sezónnost berou z p.stats, které spočítal server z celé historie.
const INSIGHT = new WeakMap(); // klíč = objekt souhrnu, takže se po úpravě dat (S.sum.clear()) přepočítá samo
function insight(p) {
  const s = sum(p);
  if (INSIGHT.has(s)) return INSIGHT.get(s);
  const c = categoryById(p.category);
  const consumer = c?.kind !== 'investicni';
  const long = s.history.length > 1 && Date.parse(s.history[s.history.length - 1].d) - Date.parse(s.history[0].d) > 300 * 86400000;
  const r = long ? minMax(s.history, 365) : null;
  const min = r ? r.min.p : p.stats?.min365 ?? minMax(s.history, 365)?.min.p ?? null;
  const max = r ? r.max.p : p.stats?.max365 ?? minMax(s.history, 365)?.max.p ?? null;
  const discount = consumer ? (p.stats?.discount !== undefined && !long ? p.stats.discount : discountCheck(s.history)) : null;
  const own = consumer ? (long ? seasonality(s.history) : p.stats?.season || null) : null;
  const catSeason = consumer ? (S.data.seasons || {})[p.category] || null : null;
  const season = own && own.amplitude >= (catSeason?.amplitude ?? 0) * 0.5 ? own : catSeason || own;
  const score = consumer && !p.free ? buyScore({ price: s.price, forecast: s.forecast, trend: s.trend, min, max, discount, season }) : null;
  const out = { score, min, max, discount, season, consumer };
  INSIGHT.set(s, out);
  return out;
}

const productById = (id) => S.data.products.find((p) => p.id === id);
const byCat = (id) => S.data.products.filter((p) => p.category === id && p.active !== false && p.rank).sort((a, b) => a.rank - b.rank);
const allRanked = () => S.data.products.filter((p) => p.active !== false && p.rank);

// Plná historie produktu (u živých dat se stahuje až pro detail).
async function fullProduct(id) {
  const p = productById(id);
  if (p && p.full !== false) return p;
  if (S.full.has(id)) return S.full.get(id);
  try {
    const r = await fetch(`/api/data?id=${encodeURIComponent(id)}`);
    if (!r.ok) throw new Error(r.status);
    const full = (await r.json()).product;
    S.full.set(id, full);
    return full;
  } catch {
    return p;
  }
}

const FULL_CACHE = new Map();
function analysis(p) {
  const key = p.id + ':' + (p.prices?.length || 0) + ':' + (p.prices?.at?.(-1)?.p ?? '');
  if (!FULL_CACHE.has(key)) FULL_CACHE.set(key, analyzeFull(p, { seasonal: categoryById(p.category)?.kind !== 'investicni' }));
  return FULL_CACHE.get(key);
}

function priceText(p, s) {
  if (p.free) return t('Zdarma');

  try {

    return '';

}

// Navigace s historií: u každého záznamu si pamatuje pozici scrollu (obnoví se tlačítkem Zpět).
const scrollKey = () => history.state?.k;
function saveScroll() {
  const k = scrollKey();

  try {
    const m = JSON.parse(sessionStorage.getItem('pm-scroll') || '{}');

}
const newKey = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);

function navigate(path, replace = false, opts = {}) {

// ---------- Toast ----------
function toast(msg, tone = 'info', ms = 4000) {
  let box = document.getElementById('toasts');
  if (!box) {
    box = document.createElement('div');
    box.id = 'toasts';
    box.className = 'toasts';
    box.setAttribute('role', 'status');
    document.body.appendChild(box);
  }
  const el = document.createElement('div');
  el.className = `toast ${tone}`;
  el.innerHTML = msg;
  box.appendChild(el);
  setTimeout(() => el.classList.add('out'), ms);
  setTimeout(() => el.remove(), ms + 400);
}

// ---------- Soubory ----------
function downloadFile(name, content, type = 'text/plain') {
  const blob = content instanceof Blob ? content : new Blob([content], { type });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = name;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}

// Sezónní profil: 12 sloupců odchylky od průměru (diverging: levnější zeleně, dražší červeně).
function seasonBars(el, profile, valFmt) {
  const W = Math.max(280, el.clientWidth || 600);
  const H = 180;
  const m = { l: 44, r: 8, t: 12, b: 26 };
  const vals = profile.filter((v) => v != null);
  const ext = Math.max(2, ...vals.map(Math.abs)) * 1.15;
  const bw = (W - m.l - m.r) / 12;
  const Y = (v) => m.t + (1 - (v + ext) / (2 * ext)) * (H - m.t - m.b);
  let svg = `<svg viewBox="0 0 ${W} ${H}" style="height:${H}px" role="img" aria-label="${esc(t('Sezónní vývoj ceny po měsících'))}" xmlns="http://www.w3.org/2000/svg">`;
  for (const v of niceTicks(-ext, ext, 4)) {
    if (Math.abs(v) > ext) continue;
    svg += `<line class="gridline" x1="${m.l}" x2="${W - m.r}" y1="${Y(v)}" y2="${Y(v)}"/><text x="${m.l - 6}" y="${Y(v) + 4}" text-anchor="end">${v > 0 ? '+' : ''}${nf(0).format(v)} %</text>`;
  }
  svg += `<line x1="${m.l}" x2="${W - m.r}" y1="${Y(0)}" y2="${Y(0)}" stroke="var(--muted)" stroke-width="1"/>`;
  profile.forEach((v, i) => {
    const x = m.l + i * bw + 2;
    const full = monthName(i, 'short').replace('.', '');
    const label = bw < 34 ? full.slice(0, bw < 24 ? 1 : 2) : full;
    svg += `<text x="${x + (bw - 4) / 2}" y="${H - 8}" text-anchor="middle">${esc(label)}</text>`;
    if (v == null) return;
    const y0 = Y(0), y1 = Y(v);
    const top = Math.min(y0, y1), h = Math.max(1.5, Math.abs(y1 - y0));
    svg += `<rect class="bar" data-i="${i}" x="${x}" y="${top}" width="${Math.max(2, bw - 4)}" height="${h}" rx="3" fill="${v > 0 ? 'var(--up)' : 'var(--down)'}"/>`;
  });
  svg += '</svg>';
  el.innerHTML = svg;
  el.querySelectorAll('.bar').forEach((b) => {
    const i = +b.dataset.i;
    b.addEventListener('pointermove', (ev) => placeTip(ev, `<b>${esc(monthName(i))}</b><div>${valFmt(profile[i])}</div>`));
    b.addEventListener('pointerleave', hideTip);
  });
}

// Export grafu do PNG: proměnné CSS se nahradí skutečnými barvami.
async function svgToPng(svgEl, filename) {
  const cs = getComputedStyle(document.documentElement);
  const clone = svgEl.cloneNode(true);
  const W = svgEl.viewBox.baseVal.width, H = svgEl.viewBox.baseVal.height;
  const resolve = (s) => s.replace(/var\((--[\w-]+)\)/g, (_, v) => cs.getPropertyValue(v).trim() || '#888');
  clone.querySelectorAll('*').forEach((n) => {
    for (const a of ['fill', 'stroke']) if (n.getAttribute(a)) n.setAttribute(a, resolve(n.getAttribute(a)));
    if (n.tagName === 'text') {
      n.setAttribute('fill', cs.getPropertyValue('--muted').trim());
      n.setAttribute('font-family', 'Archivo, Arial, sans-serif');
      n.setAttribute('font-size', '12');
    }
    if (n.classList?.contains('gridline')) n.setAttribute('stroke', cs.getPropertyValue('--grid').trim());
    if (n.classList?.contains('hover') || n.classList?.contains('hit')) n.remove();
  });
  const bg = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
  bg.setAttribute('width', W);
  bg.setAttribute('height', H);
  bg.setAttribute('fill', cs.getPropertyValue('--surface').trim());
  clone.insertBefore(bg, clone.firstChild);
  clone.setAttribute('width', W);
  clone.setAttribute('height', H);
  const url = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(new XMLSerializer().serializeToString(clone));
  const img = new Image();
  await new Promise((res, rej) => {
    img.onload = res;
    img.onerror = rej;
    img.src = url;
  });
  const scale = 2;
  const canvas = document.createElement('canvas');
  canvas.width = W * scale;
  canvas.height = H * scale;
  const ctx = canvas.getContext('2d');
  ctx.scale(scale, scale);
  ctx.drawImage(img, 0, 0);
  const blob = await new Promise((res) => canvas.toBlob(res, 'image/png'));
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}

return { T, sparkline, hideTip, lineChart, seasonBars, svgToPng };

  toggle(id) {
    const cur = cmp.list();
    let next;
    if (cur.includes(id)) next = cur.filter((x) => x !== id);
    else if (cur.length >= 4) {
      toast(t('Porovnat jde nejvýš 4 produkty najednou.'), 'err');
      return false;
    } else next = [...cur, id];
    store.set('compare', next);
    emit();
    return next.includes(id);
  },
  set(ids) {
    store.set('compare', ids.slice(0, 4));
    emit();
  },
};

const alertTarget = (a) => (a.type === 'drop' ? a.basePrice * (1 - a.value / 100) : a.value);

function describeAlert(a) {
  const p = productById(a.productId);
  const unit = p?.unit || 'Kč';
  return a.type === 'drop' ? t('pokles o {v} %', { v: a.value }) + ` (${t('pod')} ${money(alertTarget(a), unit)})` : `${t('pod')} ${money(a.value, unit)}`;
}

function checkLocalAlerts() {
  const list = localAlerts.list();
  let changed = false;
  for (const a of list) {
    if (!a.active) continue;
    const p = productById(a.productId);
    if (!p) continue;
    const s = sum(p);
    if (s.price != null && s.price <= alertTarget(a)) {
      a.active = false;
      a.triggeredAt = new Date().toISOString();
      a.triggeredPrice = s.price;
      changed = true;
      const msg = t('Hlídač ceny: {name} je teď za {price}.', { name: p.name, price: money(s.price, p.unit) });
      toast(`${esc(msg)} <a href="${productLink(p.id)}">${t('Zobrazit')}</a>`, 'ok', 9000);
      try {
        if ('Notification' in window && Notification.permission === 'granted') new Notification('BuyWise', { body: msg, icon: '/icons/icon-192.png' });
      } catch {}
    }
  }
  if (changed) store.set('alerts', list);
}

let fbAuth = null;
let fbMod = null;

async function initAuth() {
  if (S.standalone || !S.config?.firebase) return;
  try {
    const [{ initializeApp }, auth] = await Promise.all([dynImport(FB + 'firebase-app.js'), dynImport(FB + 'firebase-auth.js')]);
    fbMod = auth;
    const app = initializeApp(S.config.firebase);
    fbAuth = auth.getAuth(app);
    auth.getRedirectResult(fbAuth).catch(() => {});
    auth.onAuthStateChanged(fbAuth, async (u) => {
      if (!u) {
        S.user = null;
        S.profile = null;
        emit();
        return;
      }
      S.user = { uid: u.uid, email: u.email, name: u.displayName, photo: u.photoURL, verified: u.emailVerified, token: () => u.getIdToken() };
      try {
        const me = await apiUser('me');
        S.profile = { ...me.user, alerts: me.alerts, features: me.features };
        // Sloučí místní oblíbené a portfolio s účtem.
        const localFav = store.get('favorites', []);
        const merged = [...new Set([...(S.profile.favorites || []), ...localFav])];
        if (merged.length !== (S.profile.favorites || []).length) {
          S.profile.favorites = merged;
          apiUser('saveFavorites', { favorites: merged }).catch(() => {});
        }
        const localWish = store.get('wishlist', []);
        const have = new Set((S.profile.wishlist || []).map((w) => w.id));
        const extra = localWish.filter((w) => w && w.id && !have.has(w.id));
        if (extra.length) {
          S.profile.wishlist = [...(S.profile.wishlist || []), ...extra];
          apiUser('saveWishlist', { wishlist: S.profile.wishlist }).catch(() => {});
        }
        const localPf = store.get('portfolio', []);
        if (localPf.length && !(S.profile.portfolio || []).length) {
          const r = await apiUser('savePortfolio', { portfolio: localPf });
          S.profile.portfolio = r.portfolio;
        }
      } catch (e) {
        toast(esc(t('Účet se nepodařilo načíst: {e}', { e: e.message })), 'err');
      }
      emit();
    });
  } catch {
    // Firebase SDK se nenačetl (offline) – aplikace funguje dál bez účtu.
  }
}

function openLogin(mode = 'login') {
  if (!fbAuth) return toast(t('Přihlášení není na tomto webu nastavené.'), 'err');
  const body = openDrawer({ id: 'login', side: 'right', title: t('Účet BuyWise'), html: loginHtml(mode), label: t('Zavřít') });
  const form = body.querySelector('#login-form');
  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const msg = body.querySelector('#login-msg');
    const f = Object.fromEntries(new FormData(form));
    const btn = form.querySelector('[type=submit]');
    btn.disabled = true;
    msg.className = 'msg';
    msg.textContent = '';
    try {
      if (mode === 'reset') {
        await resetPassword(f.email);
        msg.className = 'msg ok';
        msg.textContent = t('Odkaz pro nastavení nového hesla jsme poslali na {e}.', { e: f.email });
      } else {
        if (mode === 'register') await registerEmail(f.email, f.password, f.name);
        else await loginEmail(f.email, f.password);
        closeDrawer();
        toast(mode === 'register' ? t('Účet vytvořen. Zkontroluj e-mail a potvrď adresu.') : t('Přihlášeno.'), 'ok');
      }
    } catch (err) {
      msg.className = 'msg err';
      msg.textContent = authError(err);
    } finally {
      btn.disabled = false;
    }
  });
}

const pushSupported = () => !S.standalone && 'serviceWorker' in navigator && 'PushManager' in window && !!S.config?.vapidPublicKey;

function b64ToUint8(b64) {
  const pad = '='.repeat((4 - (b64.length % 4)) % 4);
  const raw = atob((b64 + pad).replace(/-/g, '+').replace(/_/g, '/'));
  return Uint8Array.from([...raw].map((c) => c.charCodeAt(0)));
}

async function pushSubscription() {
  if (!pushSupported()) throw new Error(t('Tento prohlížeč push notifikace nepodporuje.'));
  const perm = await Notification.requestPermission();
  if (perm !== 'granted') throw new Error(t('Notifikace nejsou povolené.'));
  const reg = await navigator.serviceWorker.ready;
  let sub = await reg.pushManager.getSubscription();
  if (!sub) sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64ToUint8(S.config.vapidPublicKey) });
  return sub.toJSON();
}

function syncButtons(name, id, on, labels) {
  document.querySelectorAll(`[data-action="${name}"][data-id="${CSS.escape(id)}"]`).forEach((b) => {
    b.classList.toggle('on', on);
    b.setAttribute('aria-pressed', on);
    if (labels) {
      b.setAttribute('aria-label', on ? labels[0] : labels[1]);
      if (b.dataset.tip) b.dataset.tip = on ? labels[0] : labels[1];
    }
  });
}

});

const NAME_SEARCH = new Set(['auta', 'ojete', 'elektro', 'mobily']);

// Barevné ladění záložního pozadí (když fotky nejdou načíst).
const TINT = { nakupy: ['#23324a', '#0f151b'], domacnost: ['#24402f', '#0f1714'], investice: ['#4a3b16', '#16130b'] };

// ---------- Načítání z Commons ----------
const mem = new Map();
const pending = new Map();
const cacheKey = (k) => 'photos:' + k;

function fromCache(k) {
  if (mem.has(k)) return mem.get(k);
  const c = store.get(cacheKey(k), null);
  if (c && Date.now() - c.t < TTL && Array.isArray(c.list)) {
    mem.set(k, c.list);
    return c.list;
  }
  return null;
}
function toCache(k, list) {
  mem.set(k, list);
  store.set(cacheKey(k), { t: Date.now(), list });
}

const stripHtml = (s) => {
  const txt = String(s || '').replace(/<[^>]*>/g, ' ').replace(/\s+/g, ' ').trim();
  const el = document.createElement('textarea');
  el.innerHTML = txt;
  return el.value.slice(0, 80);
};

function parse(json) {
  const pages = Object.values(json?.query?.pages || {});
  return pages
    .map((p) => {
      const ii = p.imageinfo?.[0];
      if (!ii) return null;
      const meta = ii.extmetadata || {};
      return {
        url: ii.thumburl || ii.url,
        w: ii.width,
        h: ii.height,
        page: ii.descriptionurl,
        title: (p.title || '').replace(/^File:/, ''),
        author: stripHtml(meta.Artist?.value) || 'neznámý autor',
        license: stripHtml(meta.LicenseShortName?.value) || '',
        index: p.index ?? 0,
      };
    })
    .filter((x) => x && x.url && x.w >= 1200 && x.w / x.h >= 1.2 && x.w / x.h <= 3.6)
    .sort((a, b) => a.index - b.index);
}

async function api(params) {
  const q = new URLSearchParams({
    action: 'query', format: 'json', origin: '*', prop: 'imageinfo', iiprop: 'url|size|extmetadata',
    iiurlwidth: String(WIDTH), iiextmetadatafilter: 'Artist|LicenseShortName', ...params,
  });
  const r = await fetch(`${API}?${q}`, { headers: { 'Api-User-Agent': 'BuyWise/2.1' } });
  if (!r.ok) throw new Error('Commons ' + r.status);
  return parse(await r.json());
}

const byTitles = (titles) => !titles.length ? Promise.resolve([]) : api({ titles: titles.map((t) => 'File:' + t).join('|') }).then((list) => {
  // zachovat pořadí ze seznamu
  const order = new Map(titles.map((t, i) => [t.replace(/_/g, ' '), i]));
  return list.sort((a, b) => (order.get(a.title) ?? 99) - (order.get(b.title) ?? 99));
});

async function bySearch(query, limit = 6) {
  // Nejdřív kvalitní fotky (Quality images), pak jakékoli dostatečně velké.
  const base = { generator: 'search', gsrnamespace: '6', gsrlimit: '16' };
  let list = await api({ ...base, gsrsearch: `${query} incategory:Quality_images filetype:bitmap filew:>1600` }).catch(() => []);
  if (list.length < 2) list = list.concat(await api({ ...base, gsrsearch: `${query} filetype:bitmap filew:>1600` }).catch(() => []));
  const seen = new Set();
  return list.filter((x) => !seen.has(x.url) && seen.add(x.url)).slice(0, limit);
}

function once(key, fn) {
  const c = fromCache(key);
  if (c) return Promise.resolve(c);
  if (pending.has(key)) return pending.get(key);
  const p = fn()
    .then((list) => {
      toCache(key, list);
      return list;
    })
    .catch(() => [])
    .finally(() => pending.delete(key));
  pending.set(key, p);
  return p;
}

function customFor(catId) {
  const list = S.data?.settings?.backgrounds?.[catId];
  return Array.isArray(list) ? list.filter((x) => x && x.url).map((x) => ({ url: x.url, author: x.credit || '', license: '', page: '', custom: true })) : [];
}

async function categoryPhotos(catId) {
  const custom = customFor(catId);
  if (custom.length) return custom;
  const set = PHOTO_SETS[catId];
  if (!set) return [];
  return once('cat:' + catId, async () => {
    let list = await byTitles(set.titles).catch(() => []);
    if (list.length < 3) for (const q of set.queries) list = list.concat(await bySearch(q, 4));
    return list.slice(0, 6);
  });
}

async function productPhotos(p) {
  if (!p) return [];
  if (p.photo) return [{ url: p.photo, author: p.photoCredit || '', license: '', page: '', custom: true }];
  const q = p.attrs?.photoQuery || PRODUCT_QUERIES[p.name] || (NAME_SEARCH.has(p.category) ? p.name : null);
  const own = q ? await once('q:' + q, () => bySearch(q, 3)) : [];
  if (own.length) return own;
  return categoryPhotos(p.category);
}

async function homePhotos() {
  const custom = customFor('home');
  if (custom.length) return custom;
  const ids = ['auta', 'dovolene', 'elektro', 'komodity', 'nemovitosti', 'vstupenky', 'krypto', 'energie'];
  const sets = await Promise.all(ids.map((id) => categoryPhotos(id)));
  return sets.map((s) => s[0]).filter(Boolean);
}

// ---------- Scéna v pozadí ----------
const reduce = () => window.matchMedia('(prefers-reduced-motion: reduce)').matches || document.documentElement.dataset.motion === 'off';
const stage = {
  el: null, layers: [], active: 0, list: [], idx: 0, key: '', timer: null, current: null, token: 0,
};

function ensureStage() {
  if (stage.el) return;
  stage.el = document.getElementById('stage');
  stage.layers = [...stage.el.querySelectorAll('.stage-img')];
  document.addEventListener('visibilitychange', () => (document.hidden ? stopCycle() : startCycle()));
}

function preload(url) {
  return new Promise((res, rej) => {
    const img = new Image();
    img.decoding = 'async';
    img.onload = () => (img.decode ? img.decode().catch(() => {}).then(() => res(img)) : res(img));
    img.onerror = rej;
    img.src = url;
  });
}

function renderCredit(photo) {
  const el = document.getElementById('photo-credit');
  if (!el) return;
  if (!photo || (!photo.author && !photo.page)) {
    el.hidden = true;
    return;
  }
  el.hidden = false;
  const who = [photo.author, photo.license].filter(Boolean).join(', ');
  const page = /^https:\/\/commons\.wikimedia\.org\//.test(photo.page || '') ? photo.page : '';
  el.innerHTML = page
    ? `<a href="${escapeHtml(page)}" target="_blank" rel="noopener noreferrer">Foto: ${escapeHtml(who)}, Wikimedia Commons</a>`
    : `Foto: ${escapeHtml(who)}`;
}
const escapeHtml = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);

async function show(photo, token) {
  try {
    await preload(photo.url);
  } catch {
    return false;
  }
  if (token !== stage.token) return false;
  const next = stage.layers[1 - stage.active];
  const cur = stage.layers[stage.active];
  if (!/^(https:\/\/|data:image\/(png|jpeg|webp);)/.test(photo.url)) return;
  next.style.backgroundImage = `url("${photo.url.replace(/["\\\n\r]/g, encodeURIComponent)}")`;
  next.classList.remove('kb');
  void next.offsetWidth; // restart animace
  if (!reduce()) next.classList.add('kb');
  next.classList.add('on');
  cur.classList.remove('on');
  stage.active = 1 - stage.active;
  stage.el.classList.add('has-photo');
  stage.current = photo;
  renderCredit(photo);
  return true;
}

function stopCycle() {
  clearInterval(stage.timer);
  stage.timer = null;
}
function startCycle() {
  stopCycle();
  if (stage.list.length < 2 || reduce() || document.hidden) return;
  const token = stage.token;
  stage.timer = setInterval(async () => {
    if (token !== stage.token) return stopCycle();
    for (let tries = 0; tries < stage.list.length; tries++) {
      stage.idx = (stage.idx + 1) % stage.list.length;
      if (await show(stage.list[stage.idx], token)) break;
    }
  }, 9000);
}

/**
 * Nastaví pozadí. key = identifikátor sekce (aby se stejná sekce znovu nenačítala),
 * group = skupina odvětví pro barevné ladění, loader = async () => [fotky].
 */
async function setBackdrop(key, group, loader) {
  ensureStage();
  if (key === stage.key) return;
  stage.key = key;
  const token = ++stage.token;
  stopCycle();
  const [a, b] = TINT[group] || ['#26313b', '#10161b'];
  stage.el.style.setProperty('--tint-a', a);
  stage.el.style.setProperty('--tint-b', b);
  let list = [];
  try {
    list = await loader();
  } catch {}
  if (token !== stage.token) return;
  stage.list = list;
  stage.idx = 0;
  if (!list.length) {
    stage.layers.forEach((l) => l.classList.remove('on'));
    stage.el.classList.remove('has-photo');
    stage.current = null;
    renderCredit(null);
    return;
  }
  for (let i = 0; i < list.length; i++) {
    stage.idx = i;
    if (await show(list[i], token)) break;
  }
  startCycle();
}

// Po překreslení stránky (nový prvek pro kredit) doplní popisek aktuální fotky.
const refreshCredit = () => renderCredit(stage.current);

const groupOf = (catId) => categoryById(catId)?.group || 'nakupy';

return { PHOTO_SETS, PRODUCT_QUERIES, categoryPhotos, productPhotos, homePhotos, setBackdrop, refreshCredit, groupOf };
})();

// Čísla v hero „naběhnou“ od nuly (jen jednou po načtení, ne při každém návratu).
let counted = false;
function countUp(root) {
  if (counted || window.matchMedia('(prefers-reduced-motion: reduce)').matches || document.documentElement.dataset.motion === 'off') return;
  counted = true;
  root.querySelectorAll('[data-count]').forEach((el) => {
    const end = +el.dataset.count;
    const t0 = performance.now();
    const step = (now) => {
      const k = Math.min(1, (now - t0) / 900);
      el.textContent = Math.round(end * (1 - Math.pow(1 - k, 3)));
      if (k < 1) requestAnimationFrame(step);
    };
    requestAnimationFrame(step);
  });
}

return { renderHome };

const __js_tour_js = (() => {
// Úvodní prohlídka: zvýrazní prvek (spotlight) a vedle něj ukáže bublinu s vysvětlením.
// Ovládání: Další / Zpět / Přeskočit, šipky, Esc. Po dokončení se uloží, že ji uživatel viděl.
const { store, esc } = __js_core_js;
const { reducedMotion, hideTip, action } = __js_ui_js;
const { t } = __js_i18n_js;

let active = null;

const tourDone = () => !!store.get('tour-done', false);

function startTour(steps, { key = 'tour-done', onEnd } = {}) {
  if (active) endTour(false);
  hideTip();
  const root = document.createElement('div');
  root.className = 'tour';
  root.innerHTML = `<div class="tour-spot" aria-hidden="true"></div>
    <div class="tour-bubble" role="dialog" aria-modal="true" aria-labelledby="tour-h" aria-describedby="tour-p" tabindex="-1">
      <p class="tour-step" id="tour-n"></p>
      <h2 id="tour-h"></h2>
      <p id="tour-p"></p>
      <div class="tour-dots" aria-hidden="true">${steps.map(() => '<i></i>').join('')}</div>
      <div class="tour-btns">
        <button type="button" class="btn link" data-action="tour-skip">${t('Přeskočit')}</button>
        <span><button type="button" class="btn alt" data-action="tour-prev">${t('Zpět')}</button><button type="button" class="btn" data-action="tour-next">${t('Další')}</button></span>
      </div>
    </div>`;
  document.body.appendChild(root);
  document.getElementById('app')?.setAttribute('inert', '');
  const spot = root.querySelector('.tour-spot');
  const bubble = root.querySelector('.tour-bubble');
  let i = 0;

  const place = () => {
    const st = steps[i];
    const el = st.target ? document.querySelector(st.target) : null;
    const vw = window.innerWidth;
    const vh = window.innerHeight;
    root.classList.toggle('center', !el);
    if (!el) {
      spot.style.cssText = `left:${vw / 2}px;top:${vh / 2}px;width:0;height:0`;
      bubble.style.cssText = '';
      return;
    }
    const r = el.getBoundingClientRect();
    const pad = st.pad ?? 8;
    spot.style.cssText = `left:${r.left - pad}px;top:${r.top - pad}px;width:${r.width + pad * 2}px;height:${r.height + pad * 2}px;border-radius:${st.radius ?? 14}px`;
    const bw = Math.min(360, vw - 24);
    const bh = bubble.offsetHeight || 200;
    let top = r.bottom + pad + 14;
    let side = 'below';
    if (top + bh > vh - 12) {
      top = r.top - pad - 14 - bh;
      side = 'above';
    }
    if (top < 12) top = Math.max(12, Math.min(vh - bh - 12, r.top));
    const left = Math.max(12, Math.min(vw - bw - 12, r.left + r.width / 2 - bw / 2));
    bubble.style.cssText = `left:${left}px;top:${top}px;width:${bw}px`;
    bubble.dataset.side = side;
  };

  const show = (n) => {
    i = Math.max(0, Math.min(steps.length - 1, n));
    const st = steps[i];
    const el = st.target ? document.querySelector(st.target) : null;
    root.querySelector('#tour-n').textContent = t('{a} z {b}', { a: i + 1, b: steps.length });
    root.querySelector('#tour-h').textContent = st.title;
    root.querySelector('#tour-p').innerHTML = esc(st.text);
    root.querySelectorAll('.tour-dots i').forEach((d, k) => d.classList.toggle('on', k === i));
    root.querySelector('[data-action="tour-prev"]').hidden = i === 0;
    root.querySelector('[data-action="tour-next"]').textContent = i === steps.length - 1 ? t('Hotovo') : t('Další');
    if (el) {
      const r = el.getBoundingClientRect();
      if (r.top < 70 || r.bottom > window.innerHeight - 40) el.scrollIntoView({ block: 'center', behavior: 'instant' });
    }
    place();
    requestAnimationFrame(place);
    if (!reducedMotion()) bubble.animate([{ opacity: 0, transform: 'translateY(6px)' }, { opacity: 1, transform: 'none' }], { duration: 220, easing: 'ease-out' });
    root.querySelector('[data-action="tour-next"]').focus({ preventScroll: true });
  };

  const end = (done) => {
    store.set(key, true);
    endTour(done);
    onEnd?.(done);
  };
  root.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') end(false);
    else if (e.key === 'ArrowRight') i < steps.length - 1 ? show(i + 1) : end(true);
    else if (e.key === 'ArrowLeft') show(i - 1);
    else if (e.key === 'Tab') {
      const items = [...bubble.querySelectorAll('button:not([hidden])')];
      const k = items.indexOf(document.activeElement);
      e.preventDefault();
      items[(k + (e.shiftKey ? -1 : 1) + items.length) % items.length].focus();
    }
  });
  const onResize = () => place();
  window.addEventListener('resize', onResize);
  window.addEventListener('scroll', onResize, { passive: true });
  const next = () => (i === steps.length - 1 ? end(true) : show(i + 1));
  active = { root, onResize, next, prev: () => show(i - 1), skip: () => end(false) };
  requestAnimationFrame(() => {
    root.classList.add('open');
    show(0);
  });
}

function endTour() {
  if (!active) return;
  const { root, onResize } = active;
  active = null;
  window.removeEventListener('resize', onResize);
  window.removeEventListener('scroll', onResize);
  document.getElementById('app')?.removeAttribute('inert');
  root.classList.remove('open');
  setTimeout(() => root.remove(), reducedMotion() ? 0 : 250);
}

// Tlačítka prohlídky jdou přes jediný click handler aplikace (bublina leží mimo #app, který je neaktivní).
action('tour-next', () => active?.next());
action('tour-prev', () => active?.prev());
action('tour-skip', () => active?.skip());

  { target: '.top .search', title: t('Hledej cokoli'), text: t('Produkt, destinaci, akcii… Klávesa / skočí rovnou do hledání.'), radius: 999 },
  { target: '.top .tools a[href$="prani"]', title: t('Seznam přání'), text: t('Srdíčkem si ulož, co chceš koupit, a nastav cílovou cenu. Dáme vědět, až nastane ta správná chvíle.') },
  { target: '[data-action="open-settings"]', title: t('Nastavení'), text: t('Jazyk, měna, světlý či tmavý vzhled, přihlášení a tahle prohlídka znovu.') },
];

return { tourDone, startTour, endTour, homeSteps };
})();

const __js_share_js = (() => {
// Sdílecí obrázek produktu pro sociální sítě (1200 × 630, formát náhledů Facebooku, X i LinkedInu):
// logo, název, cena, trend, graf 6 měsíců s odhadem, skóre Kup teď / Počkej. Kreslí se v prohlížeči na canvas.
const { S, money, pct, esc, catName, categoryById, slugFile, downloadFile, toast, dateFmt, productLink } = __js_core_js;
const { openDrawer, actions } = __js_ui_js;
const { t } = __js_i18n_js;

const W = 1200, H = 630;
const C = { bg: '#10171d', bg2: '#1b2a33', ink: '#ffffff', ink2: 'rgba(255,255,255,.72)', ink3: 'rgba(255,255,255,.45)', tag: '#ffc929', tagInk: '#1d1a0c', up: '#ff9a73', down: '#6fe0a4', flat: '#c9d3d9', grid: 'rgba(255,255,255,.08)', line: '#7fb6ff' };

// Logo BuyWise: cenovka se sovíma očima („chytrá cenovka“).
function drawLogo(ctx, x, y, s) {
  ctx.save();
  ctx.translate(x, y);
  ctx.scale(s / 32, s / 32);
  ctx.fillStyle = C.tag;
  ctx.beginPath();
  ctx.moveTo(3, 7); ctx.quadraticCurveTo(3, 5, 5, 5); ctx.lineTo(20, 5); ctx.lineTo(29, 16); ctx.lineTo(20, 27); ctx.lineTo(5, 27); ctx.quadraticCurveTo(3, 27, 3, 25);
  ctx.closePath();
  ctx.fill();
  ctx.fillStyle = '#16222b';
  for (const cx of [10, 17]) {
    ctx.beginPath(); ctx.arc(cx, 15, 3.4, 0, Math.PI * 2); ctx.fill();
  }
  ctx.fillStyle = C.tag;
  for (const cx of [10.9, 17.9]) {
    ctx.beginPath(); ctx.arc(cx, 14.2, 1.1, 0, Math.PI * 2); ctx.fill();
  }
  ctx.fillStyle = '#16222b';
  ctx.beginPath(); ctx.moveTo(12.4, 19); ctx.lineTo(14.6, 19); ctx.lineTo(13.5, 21.2); ctx.closePath(); ctx.fill();
  ctx.restore();
}

function wrap(ctx, text, maxW, maxLines) {
  const words = text.split(/\s+/);
  const lines = [];
  let cur = '';
  for (const w of words) {
    const test = cur ? cur + ' ' + w : w;
    if (ctx.measureText(test).width > maxW && cur) {
      lines.push(cur);
      cur = w;
    } else cur = test;
  }
  if (cur) lines.push(cur);
  if (lines.length > maxLines) {
    lines.length = maxLines;
    lines[maxLines - 1] = lines[maxLines - 1].replace(/\s*\S*$/, '') + '…';
  }
  return lines;
}

async function renderCard(p, { s, sc, unit = 'Kč' }) {
  if (document.fonts?.ready) await document.fonts.ready.catch(() => {});
  const cv = document.createElement('canvas');
  cv.width = W;
  cv.height = H;
  const ctx = cv.getContext('2d');
  // Pozadí
  const g = ctx.createLinearGradient(0, 0, W, H);
  g.addColorStop(0, C.bg2);
  g.addColorStop(1, C.bg);
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);
  const glow = ctx.createRadialGradient(W - 160, 60, 10, W - 160, 60, 420);
  glow.addColorStop(0, 'rgba(255,201,41,.18)');
  glow.addColorStop(1, 'rgba(255,201,41,0)');
  ctx.fillStyle = glow;
  ctx.fillRect(0, 0, W, H);

  // Hlavička: logo + značka
  drawLogo(ctx, 56, 44, 44);
  ctx.fillStyle = C.ink;
  ctx.font = `800 30px ${FONT}`;
  ctx.textBaseline = 'middle';
  ctx.fillText('Buy', 110, 67);
  const bw = ctx.measureText('Buy').width;
  ctx.fillStyle = C.tag;
  ctx.fillText('Wise', 110 + bw, 67);
  ctx.fillStyle = C.ink3;
  ctx.font = `500 20px ${FONT}`;
  ctx.textAlign = 'right';
  ctx.fillText(catName(categoryById(p.category)) + (p.rank ? ` · ${t('{n}. místo', { n: p.rank })}` : ''), W - 56, 67);
  ctx.textAlign = 'left';

  // Název
  ctx.fillStyle = C.ink;
  ctx.font = `800 54px ${FONT}`;
  ctx.textBaseline = 'alphabetic';
  const lines = wrap(ctx, p.name, 640, 2);
  lines.forEach((l, i) => ctx.fillText(l, 56, 160 + i * 60));
  let y = 160 + (lines.length - 1) * 60;
  if (p.subtitle) {
    ctx.fillStyle = C.ink2;
    ctx.font = `500 24px ${FONT}`;
    ctx.fillText(wrap(ctx, p.subtitle, 640, 1)[0], 56, y + 40);
    y += 40;
  }

  // Cenovka
  const priceTxt = p.free ? t('Zdarma') : plain(money(s.price, unit));
  ctx.font = `800 52px ${FONT}`;
  const pw = ctx.measureText(priceTxt).width + 64;
  const ty = y + 40;
  ctx.fillStyle = C.tag;
  ctx.beginPath();
  ctx.moveTo(56 + 22, ty); ctx.lineTo(56 + pw, ty); ctx.lineTo(56 + pw, ty + 76); ctx.lineTo(56 + 22, ty + 76); ctx.lineTo(56, ty + 38); ctx.closePath();
  ctx.fill();
  ctx.fillStyle = C.tagInk;
  ctx.textBaseline = 'middle';
  ctx.fillText(priceTxt, 56 + 40, ty + 40);
  // Trend
  const dir = s.trend.dir;
  ctx.font = `700 24px ${FONT}`;
  ctx.fillStyle = dir === 'roste' ? C.up : dir === 'klesa' ? C.down : C.flat;
  const trendTxt = `${dir === 'roste' ? '▲' : dir === 'klesa' ? '▼' : '■'} ${t(s.trend.label)}${s.ch30 != null ? `  ${plain(pct(s.ch30))} / 30 ${t('dní')}` : ''}`;
  ctx.fillText(trendTxt, 56 + pw + 24, ty + 40);

  // Graf (180 dní + odhad)
  const hist = s.history.slice(-180);
  const fc = s.forecast?.points || [];
  const box = { x: 56, y: ty + 104, w: sc ? 780 : W - 112, h: H - (ty + 104) - 104 };
  if (hist.length > 1 && box.h > 60) {
    const all = [...hist.map((x) => x.p), ...fc.map((x) => x.p)];
    let lo = Math.min(...all), hi = Math.max(...all);
    const pad = (hi - lo || hi * 0.05) * 0.12;
    lo -= pad; hi += pad;
    const t0 = Date.parse(hist[0].d), t1 = Date.parse((fc.length ? fc[fc.length - 1] : hist[hist.length - 1]).d);
    const X = (d) => box.x + ((Date.parse(d) - t0) / (t1 - t0 || 1)) * box.w;
    const Y = (v) => box.y + box.h - ((v - lo) / (hi - lo || 1)) * box.h;
    ctx.strokeStyle = C.grid;
    ctx.lineWidth = 1;
    for (let i = 0; i <= 3; i++) {
      const gy = box.y + (box.h * i) / 3;
      ctx.beginPath(); ctx.moveTo(box.x, gy); ctx.lineTo(box.x + box.w, gy); ctx.stroke();
    }
    // plocha pod čarou
    const area = ctx.createLinearGradient(0, box.y, 0, box.y + box.h);
    area.addColorStop(0, 'rgba(127,182,255,.35)');
    area.addColorStop(1, 'rgba(127,182,255,0)');
    ctx.beginPath();
    hist.forEach((x, i) => (i ? ctx.lineTo(X(x.d), Y(x.p)) : ctx.moveTo(X(x.d), Y(x.p))));
    ctx.lineTo(X(hist[hist.length - 1].d), box.y + box.h);
    ctx.lineTo(X(hist[0].d), box.y + box.h);
    ctx.closePath();
    ctx.fillStyle = area;
    ctx.fill();
    ctx.beginPath();
    hist.forEach((x, i) => (i ? ctx.lineTo(X(x.d), Y(x.p)) : ctx.moveTo(X(x.d), Y(x.p))));
    ctx.strokeStyle = C.line;
    ctx.lineWidth = 4;
    ctx.lineJoin = 'round';
    ctx.stroke();
    if (fc.length) {
      ctx.setLineDash([10, 8]);
      ctx.beginPath();
      ctx.moveTo(X(hist[hist.length - 1].d), Y(hist[hist.length - 1].p));
      fc.forEach((x) => ctx.lineTo(X(x.d), Y(x.p)));
      ctx.strokeStyle = C.tag;
      ctx.lineWidth = 3;
      ctx.stroke();
      ctx.setLineDash([]);
    }
    const lx = X(hist[hist.length - 1].d), ly = Y(hist[hist.length - 1].p);
    ctx.fillStyle = C.ink;
    ctx.beginPath(); ctx.arc(lx, ly, 7, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = C.ink3;
    ctx.font = `500 18px ${FONT}`;
    ctx.textBaseline = 'alphabetic';
    ctx.fillText(t('6 měsíců'), box.x, box.y + box.h + 26);
    if (fc.length) {
      ctx.fillStyle = C.tag;
      ctx.textAlign = 'right';
      ctx.fillText(`- - ${t('odhad na 30 dní')}`, box.x + box.w, box.y + box.h + 26);
      ctx.textAlign = 'left';
    }
  }

  // Skóre
  if (sc) {
    const r = 78, cx = 1012, cy = Math.min(box.y + box.h / 2, H - 60 - 46 - r);
    const col = sc.tone === 'buy' ? C.down : sc.tone === 'wait' ? C.up : C.flat;
    ctx.lineWidth = 16;
    ctx.strokeStyle = 'rgba(255,255,255,.1)';
    ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.stroke();
    ctx.strokeStyle = col;
    ctx.lineCap = 'round';
    ctx.beginPath(); ctx.arc(cx, cy, r, -Math.PI / 2, -Math.PI / 2 + (Math.PI * 2 * sc.score) / 100); ctx.stroke();
    ctx.lineCap = 'butt';
    ctx.fillStyle = C.ink;
    ctx.font = `800 64px ${FONT}`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(String(sc.score), cx, cy - 6);
    ctx.font = `600 16px ${FONT}`;
    ctx.fillStyle = C.ink3;
    ctx.fillText('/ 100', cx, cy + 34);
    ctx.fillStyle = col;
    ctx.font = `800 ${t(sc.label).length > 12 ? 21 : 26}px ${FONT}`;
    ctx.fillText(t(sc.label), cx, cy + r + 34);
    ctx.textAlign = 'left';
  }

  // Patička
  ctx.fillStyle = C.ink3;
  ctx.font = `500 18px ${FONT}`;
  ctx.textBaseline = 'alphabetic';
  ctx.fillText(t('Kupuj chytře. Víš, kdy cena klesne.'), 56, H - 30);
  ctx.textAlign = 'right';
  const host = S.hash ? 'BuyWise' : location.host;
  ctx.fillText(`${host} · ${dateFmt(s.priceDate)}`, W - 56, H - 30);
  ctx.textAlign = 'left';
  return cv;
}

async function shareCard(p, opts) {
  const cv = await renderCard(p, opts);
  const blob = await new Promise((res) => cv.toBlob(res, 'image/png'));
  if (!blob) throw new Error('canvas');
  const name = `${slugFile(p.name)}-buywise.png`;
  const file = new File([blob], name, { type: 'image/png' });
  const url = URL.createObjectURL(blob);
  const pageUrl = S.hash ? location.href : location.origin + productLink(p.id);
  const canShareFile = !!(navigator.canShare && navigator.canShare({ files: [file] }));
  const body = openDrawer({
    id: 'card',
    side: 'right',
    wide: true,
    title: t('Obrázek pro sociální sítě'),
    label: t('Zavřít'),
    html: `<figure class="card-preview"><img src="${url}" alt="${esc(t('Náhled obrázku: {n}', { n: p.name }))}" width="1200" height="630"><figcaption class="note">${t('1200 × 630 px – formát náhledů pro Facebook, X, LinkedIn i WhatsApp.')}</figcaption></figure>
      <div class="btns">
        ${canShareFile ? `<button type="button" class="btn" data-action="card-share">${t('Sdílet obrázek')}</button>` : ''}
        <button type="button" class="btn ${canShareFile ? 'alt' : ''}" data-action="card-dl">${t('Stáhnout PNG')}</button>
        <button type="button" class="btn alt" data-action="card-copy">${t('Kopírovat odkaz')}</button>
      </div>`,
    onClose: () => setTimeout(() => URL.revokeObjectURL(url), 1000),
  });
  actions({
      'card-dl': () => downloadFile(name, blob),
      'card-share': async () => {
        try {
          await navigator.share({ files: [file], title: p.name, text: `${p.name} – BuyWise`, url: pageUrl });
        } catch {}
      },
      'card-copy': async () => {
        try {
          await navigator.clipboard.writeText(pageUrl);
          toast(t('Odkaz zkopírován do schránky.'), 'ok');
        } catch {
          toast(esc(pageUrl), 'info', 8000);
        }
      },
  });
  return body;
}

return { drawLogo, renderCard, shareCard };
})();

function energyPrice(kind) {
  const find = (name) => S.data.products.find((p) => p.category === 'pohonne' && p.name === name);
  const pick = kind === 'nafta' ? find('Nafta') : kind === 'elektro' ? find('Nabíjení AC') || find('Elektřina doma') : find('Natural 95');
  const s = pick ? sum(pick) : null;
  return s?.price ?? (kind === 'nafta' ? 36.5 : kind === 'elektro' ? 7 : 37.9);
}

function topCorrelations(p, h) {
  return ['komodity', 'krypto', 'akcie']
    .flatMap((id) => byCat(id))
    .filter((x) => x.id !== p.id)
    .map((o) => ({ o, c: correlation(h, sum(o).history) }))
    .filter((x) => x.c && Math.abs(x.c.r) >= 0.3)
    .sort((a, b) => Math.abs(b.c.r) - Math.abs(a.c.r))
    .slice(0, 3);
}

          await apiUser('addAlert', { ...base, channels: remote, subscription: sub });

        } else if (sub) {
          const r = await apiUser('pushAlert', { ...base, subscription: sub }, false);
          pushAlerts.add({ ...base, id: r.id, token: r.token, active: true });

      }

    } catch (err) {
      msg.textContent = err.message;
      msg.className = 'msg err';
    }
  });
  if (location.hash === '#hlidac') setTimeout(() => main.querySelector('[data-action="p-watch"]')?.click(), 50);
  return true;
}

// Plynulé přeskupení řádků (FLIP) při změně řazení či filtru.
function flip(container, fn) {
  const before = new Map([...container.querySelectorAll('[data-pid]')].map((el) => [el.dataset.pid, el.getBoundingClientRect().top]));
  fn();
  if (reducedMotion()) return;
  container.querySelectorAll('[data-pid]').forEach((el, i) => {
    const old = before.get(el.dataset.pid);
    if (old == null) {
      el.animate([{ opacity: 0, transform: 'translateY(8px)' }, { opacity: 1, transform: 'none' }], { duration: 260, delay: i * 18, easing: 'ease-out', fill: 'backwards' });
      return;
    }
    const dy = old - el.getBoundingClientRect().top;
    if (dy) el.animate([{ transform: `translateY(${dy}px)` }, { transform: 'none' }], { duration: 340, easing: 'cubic-bezier(.2,.7,.2,1)' });
  });
}

}

function drawQuickChart(root, p) {
  const el = root.querySelector('#qvChart');
  if (!el) return;
  const s = sum(p);
  const h = s.history.slice(-90);
  const u = p.unit || 'Kč';
  const f = s.forecast;
  lineChart(el, {
    series: [
      { name: p.name, color: 'var(--s1)', data: h.map((x) => ({ t: T(x.d), v: conv(x.p, u).v })), width: 2.25 },
      ...(f ? [{ name: t('Odhad'), color: 'var(--s1)', dash: '5 4', data: f.points.map((x) => ({ t: T(x.d), v: conv(x.p, u).v })) }] : []),
    ],
    band: f ? f.points.map((x) => ({ t: T(x.d), lo: conv(x.lo, u).v, hi: conv(x.hi, u).v })) : null,
    todayT: f && h.length ? T(h[h.length - 1].d) : null,
    height: 190,
    animate: !reducedMotion(),
    valFmt: (x) => `${nf(Math.abs(x) >= 100 ? 0 : 2, 0).format(x)} ${unitOf(u)}`,
    label: t('Graf vývoje ceny'),
  });
}

function renderCategory(main, id, query = new URLSearchParams()) {
  const c = categoryById(id);
  if (!c) return false;
  document.title = `${catName(c)} – BuyWise`;
  const st = {
    sort: query.get('razeni') || 'rank',
    only: query.get('filtr') || '',
    min: query.get('od') || '',
    max: query.get('do') || '',
    sel: query.get('vyber') || '',
  };
  const consumer = c.kind === 'spotrebni';
  const list = byCat(id).map((p) => ({ p, s: sum(p), sc: insight(p).score }));
  const buyN = list.filter((x) => x.sc?.tone === 'buy').length;
  const inactive = S.data.products.filter((p) => p.category === id && (p.active === false || !p.rank));
  const n = (dir) => list.filter((x) => x.s.trend.dir === dir).length;
  const withCh = list.filter((x) => x.s.ch30 != null);
  const avg = withCh.length ? withCh.reduce((a, x) => a + x.s.ch30, 0) / withCh.length : null;
  const waitN = list.filter((x) => x.s.forecast && x.s.forecast.changePct <= -3).length;
  const season = (S.data.seasons || {})[id];
  const hasSale = list.some((x) => x.p.discount > 0 || (x.s.ch7 != null && x.s.ch7 < -2));

  const filtered = () => {
    const min = parseFloat(String(st.min).replace(',', '.'));
    const max = parseFloat(String(st.max).replace(',', '.'));
    return list.filter(({ p, s }) => {
      const v = conv(s.price, p.unit).v;
      if (Number.isFinite(min) && !(v >= min)) return false;
      if (Number.isFinite(max) && !(v <= max)) return false;
      if (st.only === 'down' && s.trend.dir !== 'klesa') return false;
      if (st.only === 'up' && s.trend.dir !== 'roste') return false;
      if (st.only === 'sale' && !(p.discount > 0 || (s.ch7 != null && s.ch7 < -2))) return false;
      if (st.only === 'fav' && !favs.has(p.id)) return false;
      if (st.only === 'wait' && !(s.forecast && s.forecast.changePct <= -3)) return false;
      if (st.only === 'buy' && insight(p).score?.tone !== 'buy') return false;
      return true;
    });
  };
  const sorted = () =>
    [...filtered()].sort((a, b) => {
      if (st.sort === 'ch30') return (b.s.ch30 ?? -1e9) - (a.s.ch30 ?? -1e9);
      if (st.sort === 'fc') return (a.s.forecast?.changePct ?? 1e9) - (b.s.forecast?.changePct ?? 1e9);
      if (st.sort === 'price') return (a.s.price ?? 1e18) - (b.s.price ?? 1e18);
      if (st.sort === 'score') return (b.sc?.score ?? -1) - (a.sc?.score ?? -1);
      return a.p.rank - b.p.rank;
    });

  const sorts = [['rank', t('Pořadí')], ...(consumer ? [['score', t('Skóre nákupu')]] : []), ['ch30', t('Změny ceny')], ['fc', t('Očekávaného poklesu')], ['price', t('Ceny')]];
  const onlys = [['', t('Vše')], ...(consumer ? [['buy', t('Kup teď')]] : []), ['down', t('Zlevňuje')], ['up', t('Zdražuje')], ['wait', t('Vyplatí se počkat')], ...(hasSale ? [['sale', t('Ve slevě')]] : []), ['fav', t('Oblíbené')]];
  const cur = unitOf(list[0]?.p.unit || 'Kč');
  const controlsHtml = () => `
    <div class="ctl"><span class="ctl-label">${t('Řadit podle')}</span>
      <span class="seg" role="group" aria-label="${esc(t('Řazení'))}">${sorts.map(([k, l]) => `<button type="button" data-action="c-sort" data-v="${k}" aria-pressed="${st.sort === k}">${l}</button>`).join('')}</span></div>
    <div class="ctl"><span class="ctl-label">${t('Filtr')}</span>
      <span class="seg" role="group" aria-label="${esc(t('Filtr'))}">${onlys.map(([k, l]) => `<button type="button" data-action="c-only" data-v="${k}" aria-pressed="${st.only === k}">${l}</button>`).join('')}</span></div>
    <div class="ctl"><span class="ctl-label">${t('Cena')}</span>
      <label class="range"><span class="sr-only">${t('Cena od')}</span><input type="number" inputmode="decimal" data-range="min" value="${esc(st.min)}" placeholder="${esc(t('od'))} ${esc(cur)}"></label>
      <label class="range"><span class="sr-only">${t('do')}</span><input type="number" inputmode="decimal" data-range="max" value="${esc(st.max)}" placeholder="${esc(t('do'))} ${esc(cur)}"></label></div>`;
  const activeFilters = () => (st.only ? 1 : 0) + (st.min ? 1 : 0) + (st.max ? 1 : 0) + (st.sort !== 'rank' ? 1 : 0);

  const row = ({ p, s, sc }, i) => {
    const f = s.forecast;
    const fav = favs.has(p.id);
    const selected = p.id === st.sel;
    return `<li data-pid="${esc(p.id)}" role="option" aria-selected="${selected}" tabindex="${selected || (!st.sel && i === 0) ? 0 : -1}" data-action="c-select" style="--i:${i}">
      <span class="tagcell"><span class="tag">${p.rank}</span>${rankMove(p)}</span>
      <span class="who">${p.image ? `<img class="thumb" src="${esc(p.image)}" alt="" loading="lazy">` : ''}<span><a class="nm" href="${productLink(p.id)}" data-prefetch="${esc(p.id)}" tabindex="-1">${esc(p.name)}</a>${p.sample ? `<span class="sample">${t('ukázka')}</span>` : ''}${p.discount ? `<span class="sale">−${p.discount} %</span>` : ''}<span class="sub">${esc(p.subtitle || '')}</span><span class="dem">${esc(p.demand || '')}</span></span></span>
      <span class="spark">${sparkline(s.history, s.trend.dir)}</span>
      <span class="price">${priceText(p, s)}<small>${esc(catPriceLabel(c))}</small></span>
      <span class="ch">${chip(s.trend)}<span class="small ${pctClass(s.ch30)}">${s.ch30 == null ? '' : pct(s.ch30) + ' / 30 d'}</span></span>
      <span class="fc">${consumer ? scoreBadge(sc) : ''}<span class="fc-txt">${f ? `<span class="${pctClass(f.changePct)}">${pct(f.changePct)}</span><small>${t('odhad za 30 dní')}</small>` : `<span class="muted">${t('málo dat')}</span>`}</span></span>
      <button type="button" class="star ${fav ? 'on' : ''}" data-action="fav" data-id="${esc(p.id)}" aria-pressed="${fav}" aria-label="${esc(fav ? t('Odebrat z oblíbených') : t('Přidat do oblíbených'))}" data-tip="${esc(fav ? t('Odebrat z oblíbených') : t('Přidat do oblíbených'))}" tabindex="-1">${ICON.star}</button>
    </li>`;
  };

  const heroHtml = hero({
    size: 'hero-cat',
    crumb: `<a href="${link('/')}">${t('Přehled')}</a>`,
    title: esc(catName(c)),
    lead: esc(catNote(c)),
    below: `<dl class="hero-stats">
      <div><dt>${t('v žebříčku')}</dt><dd>${list.length}</dd></div>
      <div><dt>${t('zdražuje')}</dt><dd class="up">${n('roste')}</dd></div>
      <div><dt>${t('zlevňuje')}</dt><dd class="down">${n('klesa')}</dd></div>
      <div><dt>${t('průměrná změna za 30 dní')}</dt><dd>${pct(avg)}</dd></div>
      ${consumer ? `<div><dt>${t('dobrá chvíle koupit')}</dt><dd class="down">${buyN}</dd></div><div><dt>${t('vyplatí se počkat')}</dt><dd>${waitN}</dd></div>` : ''}
      ${season?.strong ? `<div><dt>${t('obvykle nejlevnější měsíc')}</dt><dd>${esc(monthName(season.bestMonth))}</dd></div>` : ''}
    </dl>`,
  });

  main.innerHTML =
    heroHtml +
    sheet(`
    <div class="toolbar">
      <div class="controls" id="controls">${controlsHtml()}</div>
      <button type="button" class="btn alt only-narrow" data-action="c-filters">${ICON.sliders}${t('Řazení a filtry')}<span class="count" id="fcount">${activeFilters() || ''}</span></button>
      <button type="button" class="btn alt" data-action="c-csv" data-tip="${esc(t('Stáhnout žebříček pro Excel'))}">${ICON.download}<span class="hide-narrow">${t('Stáhnout CSV')}</span></button>
    </div>
    <div class="md">
      <div class="md-master">
        <div class="rank-head ${consumer ? 'has-score' : ''}" aria-hidden="true"><span>${t('Pořadí')}</span><span>${t('Produkt a poptávka')}</span><span>${t('90 dní')}</span><span>${esc(catPriceLabel(c))}</span><span>${t('Trend')}</span><span data-short="${esc(t('Skóre'))}">${consumer ? t('Skóre a výhled') : t('Výhled')}</span><span></span></div>
        <ol class="rank ${consumer ? 'has-score' : ''}" id="rank" role="listbox" aria-label="${esc(t('Žebříček'))}"></ol>
        <p class="empty" id="noresult" hidden>${t('Filtru neodpovídá žádný produkt.')}</p>
        <p class="note hint">${t('Klikni na řádek pro rychlý náhled, na název pro celý detail. Šipkami nahoru a dolů procházíš žebříček.')}</p>
      </div>
      <aside class="md-detail" id="detail" aria-live="polite"></aside>
    </div>
    <div class="acc-list section">
      ${season?.strong ? accordion({ id: 'acc-cseason', title: t('Kdy je odvětví nejlevnější'), sub: t('Průměrná odchylka cen od dlouhodobého trendu podle měsíce. Zelená = levněji.'), body: '<div class="chart" id="season"></div>' }) : ''}
      ${inactive.length ? accordion({ id: 'acc-out', title: t('Vypadlo z žebříčku'), sub: nProducts(inactive.length), body: `<ul class="list">${inactive.map((p) => `<li data-pid="${esc(p.id)}"><a class="item" href="${productLink(p.id)}"><span class="nm">${esc(p.name)}</span><span class="val">${priceText(p, sum(p))}</span><span class="sub">${p.prevRank ? t('dříve {n}. místo', { n: p.prevRank }) : t('dříve v žebříčku')}</span></a></li>`).join('')}</ul>` }) : ''}
    </div>`);

  const rankEl = main.querySelector('#rank');
  const detail = main.querySelector('#detail');

  const draw = (animate) => {
    const rows = sorted();
    const fn = () => {
      rankEl.innerHTML = rows.map(row).join('');
      main.querySelector('#noresult').hidden = !!rows.length || !list.length;
      if (!list.length) rankEl.innerHTML = `<li class="empty">${t('Žebříček je prázdný. Přidej produkty v administraci.')}</li>`;
    };
    animate ? flip(rankEl, fn) : fn();
    if (!animate) rankEl.classList.add('enter');
    const fc = main.querySelector('#fcount');
    if (fc) fc.textContent = activeFilters() || '';
  };

  // Detail: na širokém displeji panel vpravo, jinak drawer zespodu.
  const showDetail = (pid, { open = false, background = true } = {}) => {
    const p = productById(pid);
    if (!p) return;
    rankEl.querySelectorAll('[role=option]').forEach((li) => {
      const on = li.dataset.pid === pid;
      li.setAttribute('aria-selected', on);
      li.tabIndex = on ? 0 : -1;
    });
    if (isWide()) {
      const swap = () => {
        detail.innerHTML = quickView(p);
        drawQuickChart(detail, p);
      };
      if (detail.firstElementChild && !reducedMotion()) {
        const old = detail.firstElementChild;
        old.animate([{ opacity: 1 }, { opacity: 0, transform: 'translateY(-6px)' }], { duration: 120, easing: 'ease-in' }).onfinish = () => {
          swap();
          detail.firstElementChild?.animate([{ opacity: 0, transform: 'translateY(8px)' }, { opacity: 1, transform: 'none' }], { duration: 220, easing: 'cubic-bezier(.2,.7,.2,1)' });

      requestAnimationFrame(() => drawQuickChart(body, p));

  };

  const select = (pid, opts = {}) => {
    st.sel = pid;
    setQuery({ vyber: pid });
    showDetail(pid, { open: true, ...opts });
  };

  draw(false);
  // Výchozí obsah panelu: vybraný produkt z adresy, jinak první v žebříčku (pozadí zůstane na odvětví).
  const initial = st.sel && productById(st.sel) ? st.sel : list[0]?.p.id;
  if (initial) {
    if (isWide()) showDetail(initial, { background: !!st.sel });
    else if (st.sel) showDetail(initial, { open: true });
  }

  const apply = (animate = true) => {
    setQuery({ razeni: st.sort === 'rank' ? null : st.sort, filtr: st.only || null, od: st.min || null, do: st.max || null });
    draw(animate);
    if (st.sel) rankEl.querySelector(`[data-pid="${CSS.escape(st.sel)}"]`)?.setAttribute('aria-selected', 'true');
  };

  // Klávesnice v seznamu: šipky mění výběr, Enter otevře celý detail, mezerník náhled.
  rankEl.addEventListener('keydown', (e) => {
    const items = [...rankEl.querySelectorAll('[role=option]')];
    const i = items.indexOf(document.activeElement);
    if (i < 0) return;
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
      e.preventDefault();
      const next = items[Math.max(0, Math.min(items.length - 1, i + (e.key === 'ArrowDown' ? 1 : -1)))];
      next.focus();
      if (isWide()) select(next.dataset.pid);
    } else if (e.key === ' ') {
      e.preventDefault();
      select(items[i].dataset.pid);
    } else if (e.key === 'Enter') {
      e.preventDefault();
      items[i].querySelector('a.nm')?.click();
    }
  });

  // Rozsah cen: změna hodnoty (není to kliknutí)
  const onRange = (e) => {
    const inp = e.target.closest('[data-range]');
    if (!inp) return;
    st[inp.dataset.range] = inp.value;
    apply(false);
  };
  main.querySelector('#controls').addEventListener('input', onRange);

  // Akce (jediný click handler v ui.js)
  const setSeg = (name, v) => document.querySelectorAll(`[data-action="${name}"]`).forEach((x) => x.setAttribute('aria-pressed', x.dataset.v === v));
  actions({
    'c-select': (el, e) => {
      if (e.target.closest('.star')) return;
      select(el.dataset.pid);
    },
    'c-sort': (el) => {
      st.sort = el.dataset.v;
      setSeg('c-sort', st.sort);
      apply();
    },
    'c-filters': () => {
      const body = openDrawer({ id: 'filters', side: 'bottom', title: t('Řazení a filtry'), html: `<div class="controls stacked">${controlsHtml()}</div><button type="button" class="btn wide" data-action="drawer-close">${t('Zobrazit {x}', { x: nProducts(filtered().length) })}</button>`, label: t('Zavřít') });
      body.addEventListener('input', (e) => {
        onRange(e);
        body.querySelector('.btn.wide').textContent = t('Zobrazit {x}', { x: nProducts(filtered().length) });
      });
    },
    'c-csv': () => {
      const rows = [[t('Pořadí'), t('Název'), t('Podtitul'), t('Cena'), t('Jednotka'), t('Změna 30 dní %'), t('Trend'), t('Odhad za 30 dní'), t('Skóre nákupu'), t('Poptávka')]];
      for (const { p, s } of sorted()) rows.push([p.rank, p.name, p.subtitle || '', s.price, p.unit || 'Kč', s.ch30 != null ? +s.ch30.toFixed(2) : '', t(s.trend.label), s.forecast ? +s.forecast.endPrice.toFixed(2) : '', insight(p).score?.score ?? '', p.demand || '']);
      downloadFile(`buywise-${id}-${new Date().toISOString().slice(0, 10)}.csv`, toCsv(rows), 'text/csv;charset=utf-8');
    },
  });
  // Filtry uvnitř draweru mění i tlačítko s počtem výsledků
  actions({
    'c-only': (el) => {
      st.only = el.dataset.v;
      setSeg('c-only', st.only);
      apply();
      const b = document.querySelector('#filters .btn.wide');
      if (b) b.textContent = t('Zobrazit {x}', { x: nProducts(filtered().length) });
    },
  });

  if (season?.strong) {
    const drawS = () => {
      const el = main.querySelector('#season');
      if (el && el.offsetParent) seasonBars(el, season.profile, (v) => (v == null ? '—' : `${pct(v)} ${t('proti průměru')}`));
    };
    main.addEventListener('acc-open', (e) => e.target.id === 'acc-cseason' && requestAnimationFrame(drawS));
    S.redraw = () => {
      drawS();
      if (isWide() && detail.firstElementChild) drawQuickChart(detail, productById(detail.firstElementChild.dataset.pid));
    };
  } else {
    S.redraw = () => {
      if (isWide() && detail.firstElementChild) drawQuickChart(detail, productById(detail.firstElementChild.dataset.pid));
      else if (isWide() && !detail.firstElementChild && initial) showDetail(st.sel || initial, { background: false });
    };
  }

  return {
    // Přechod zpět/vpřed na stejné stránce s jinými parametry
    update(q) {
      st.sel = q.get('vyber') || '';
      if (st.sel) showDetail(st.sel, { open: !drawerOpen() });
      else if (!isWide()) closeDrawer();
      else setBackdrop('cat:' + id, groupOf(id), () => categoryPhotos(id));
    },
  };
}

return { quickView, drawQuickChart, renderCategory };
})();

      ${ids.length ? `<button type="button" class="btn alt" data-action="cmp-clear">${t('Vyprázdnit')}</button><button type="button" class="btn alt" data-action="cmp-share">${ICON.share}${t('Odkaz na porovnání')}</button>` : ''}
    </form>
    ${
      items.length
        ? `<div class="chart-card reveal"><div class="legend">${items.map((x, i) => `<span><i style="background:${CMP_COLORS[i]}"></i>${esc(x.p.name)}</span>`).join('')}</div><div class="chart" id="idx"></div></div>
      <div class="table-wrap reveal" style="margin-top:20px"><table class="cmp compare">
        <thead><tr><th></th>${items.map((x, i) => `<th data-pid="${esc(x.p.id)}"><span class="dot" style="background:${CMP_COLORS[i]}"></span><a class="nm" href="${productLink(x.p.id)}">${esc(x.p.name)}</a><button type="button" class="icon-btn sm" data-action="cmp-rm" data-id="${esc(x.p.id)}" aria-label="${esc(t('Odebrat'))}" data-tip="${esc(t('Odebrat z porovnání'))}">${ICON.close}</button></th>`).join('')}</tr></thead>
        <tbody>${rowsDef.map(([label, fn]) => `<tr><th>${label}</th>${items.map((x) => `<td>${fn(x)}</td>`).join('')}</tr>`).join('')}</tbody>
      </table></div>`
        : `<p class="empty">${t('Zatím tu nic není. Přidej produkt výběrem nahoře nebo tlačítkem Porovnat u produktu.')}</p>`
    }`);

  main.querySelector('#addSel').addEventListener('change', (e) => {
    if (!e.target.value) return;
    cmp.toggle(e.target.value);
    navigate('/porovnat', true);
  });
  actions({
    'cmp-clear': () => {
      cmp.set([]);
      navigate('/porovnat', true);
    },
    'cmp-share': async () => {
      const url = `${S.hash ? location.href.split('#')[0] + '#' : location.origin}/porovnat?ids=${ids.map(encodeURIComponent).join(',')}`;
      try {
        await navigator.clipboard.writeText(url);
        toast(t('Odkaz zkopírován do schránky.'), 'ok');
      } catch {}
    },
    'cmp-rm': (el) => {
      cmp.toggle(el.dataset.id);
      navigate('/porovnat', true);
    },
  });

  if (items.length) {
    const draw = () => {
      const now = Math.max(...items.map((x) => (x.s.history.length ? T(x.s.history[x.s.history.length - 1].d) : 0)));
      const start = now - 180 * 86400000;
      const series = items.map((x, i) => {
        const pts = x.s.history.filter((q) => T(q.d) >= start);
        const base = pts[0]?.p;
        return { name: x.p.name, color: CMP_COLORS[i], data: base ? pts.map((q) => ({ t: T(q.d), v: (q.p / base) * 100 })) : [] };
      });
      lineChart(main.querySelector('#idx'), { series, animate: true, valFmt: (v) => nf(1).format(v), yFmt: (v) => nf(0).format(v), label: t('Porovnání vývoje cen') });
    };
    draw();
    S.redraw = draw;
  }
  return true;
}

return { renderCompare };
})();

        .map((r, i) => `<i style="width:${total ? (r.value / total) * 100 : 0}%;background:${PF_COLORS[i % PF_COLORS.length]}" title="${esc(r.p.name)}: ${pct(total ? (r.value / total) * 100 : 0, false)}"></i>`)

            <td class="num ${r.pl >= 0 ? 'chg-down' : 'chg-up'}">${r.pl >= 0 ? '+' : '−'}${money(Math.abs(r.pl), 'Kč')}<br><span class="small">${pct(r.plPct)}</span></td>
            <td><button type="button" class="btn danger" data-action="pf-rm" data-id="${esc(r.h.id)}">${t('Smazat')}</button></td></tr>`
          )
          .join('')}</tbody></table></div>
      <div class="btns"><button type="button" class="btn alt" data-action="pf-csv">${t('Stáhnout CSV')}</button></div>`

    }

        <label class="field">${t('Množství')}<input name="qty" type="number" step="any" min="0" required></label>

    main.querySelector('#bpLabel').textContent = `${t('Nákupní cena za kus')} (${unitOf(p.unit)})`;
    form.buyPrice.value = +conv(sum(p).price, p.unit).v.toFixed(2);
  });
  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const fd = Object.fromEntries(new FormData(form).entries());
    const p = productById(fd.productId);
    const qty = parseFloat(String(fd.qty).replace(',', '.'));
    const bp = parseFloat(String(fd.buyPrice).replace(',', '.'));
    if (!p || !(qty > 0) || !(bp > 0)) return toast(t('Vyplň produkt, množství a cenu.'), 'err');
    const buyPrice = bp / (conv(1, p.unit).v || 1);
    await portfolio.save([...portfolio.list(), { id: Date.now().toString(36), productId: p.id, qty, buyPrice, date: fd.date, note: fd.note }]);
    toast(t('Přidáno do portfolia.'), 'ok');
    renderPortfolio(main, new URLSearchParams());
  });
  actions({
    'pf-rm': async (el) => {
      await portfolio.save(portfolio.list().filter((h) => h.id !== el.dataset.id));
      renderPortfolio(main, new URLSearchParams());
    },
    'pf-csv': () => {
      const out = [[t('Položka'), t('Množství'), t('Nákupní cena'), t('Cena teď'), t('Hodnota'), t('Zisk / ztráta'), t('Datum nákupu')]];
      for (const r of rows) out.push([r.p.name, r.h.qty, r.h.buyPrice, r.s.price, +r.value.toFixed(2), +r.pl.toFixed(2), r.h.date || '']);
      downloadFile('buywise-portfolio.csv', toCsv(out), 'text/csv;charset=utf-8');
    },
  });
  return true;
}

return { renderPortfolio };
})();

  main.innerHTML =

const __js_local_api_js = (() => {
// Administrace pro samostatnou HTML verzi: data žijí v S.data a v localStorage prohlížeče.
// Tento soubor se použije jen při sestavení buywise.html místo admin-api.js.

// Načte uložená data (nebo ukázková).
function loadLocalData() {
  const saved = store.get('data', null);
  const settings = store.get('settings', {});
  const demo = demoProducts();
  if (saved && saved.v === 2 && Array.isArray(saved.ids)) {
    const edited = new Map((saved.edited || []).map((p) => [p.id, p]));
    const demoMap = new Map(demo.map((p) => [p.id, p]));
    const products = saved.ids.map((id) => edited.get(id) || demoMap.get(id)).filter(Boolean);
    return { products, edited: true, settings };
  }
  return { products: demo, edited: false, settings };
}
const { S, store } = __js_core_js;
const { categoryById } = __lib_categories_js;
const { demoProducts, seedProducts } = __lib_seed_js;
const { merge, parseCsv, applyImport } = __lib_dataops_js;

const adminAuth = { session: true, useGoogle: false };
const adminLogin = async () => {};
const adminLogout = async () => {};
const adminLocal = true;

function persistLocal(note) {
  S.sum.clear();
  S.data.edited = true;
  const audit = store.get('audit', []);
  if (note) audit.unshift({ at: new Date().toISOString(), who: 'tento prohlížeč', action: note[0], target: note[1] || '', summary: note[2] || '' });
  store.set('audit', audit.slice(0, 100));
  // Ukládá jen upravené produkty + seznam ID; ukázková data se při načtení vygenerují znovu (šetří místo).
  const payload = { v: 2, ids: S.data.products.map((p) => p.id), edited: S.data.products.filter((p) => !p.sample) };
  if (!store.set('data', payload)) throw new Error('Prohlížeč nedovolil data uložit (plné nebo zakázané úložiště). Změny platí jen do zavření stránky.');
}

async function adminApi(action, payload = {}) {
  const all = S.data.products;
  switch (action) {
    case 'status':
      return { ok: true, count: all.length, meta: null, pending: 0, who: 'tento prohlížeč' };
    case 'list':
      return { ok: true, products: all.filter((p) => p.category === payload.category).sort((a, b) => (a.rank ?? 99) - (b.rank ?? 99)) };
    case 'save': {
      const input = payload.product || {};
      if (!input.name || !categoryById(input.category)) throw new Error('Chybí název nebo odvětví');
      const prev = input.id ? all.find((p) => p.id === input.id) : null;
      const p = merge(prev, input);
      S.data.products = all.filter((x) => x.id !== p.id).concat(p);
      persistLocal([prev ? 'úprava' : 'nový produkt', p.id, p.name]);
      return { ok: true, product: p };
    }
    case 'bulkSave': {
      const out = [];
      for (const input of payload.items || []) {
        const prev = all.find((p) => p.id === input.id);
        if (prev) out.push(merge(prev, { ...input, category: prev.category }));
      }
      const ids = new Set(out.map((p) => p.id));
      S.data.products = all.filter((p) => !ids.has(p.id)).concat(out);
      persistLocal(['hromadná úprava', payload.category, `${out.length} produktů`]);
      return { ok: true, saved: out.length };
    }
    case 'delete':
      S.data.products = all.filter((p) => p.id !== payload.id);
      persistLocal(['smazání', payload.id]);
      return { ok: true };
    case 'import':
    case 'importRows': {
      const cat = categoryById(payload.category);
      const rows = action === 'import' ? parseCsv(payload.csv || '') : payload.rows || [];
      if (!cat || !rows.length) throw new Error('Nejsou tu žádné řádky s pořadím a názvem');
      const out = applyImport(all.filter((p) => p.category === cat.id), cat.id, rows);
      const ids = new Set(out.map((p) => p.id));
      S.data.products = all.filter((p) => !ids.has(p.id)).concat(out);
      persistLocal(['import', cat.id, `${rows.length} řádků (${payload.source || 'CSV'})`]);
      return { ok: true, imported: rows.length };
    }
    case 'seed':
      S.data.products = demoProducts();
      S.data.edited = false;
      S.sum.clear();
      store.set('data', null);
      return { ok: true, added: S.data.products.length };
    case 'clearSamples': {
      // Vymaže ukázkovou historii a nechá jen výchozí produkty s dnešní cenou.
      S.data.products = seedProducts();
      persistLocal(['výchozí data bez historie', '', '']);
      return { ok: true, added: S.data.products.length };
    }
    case 'getSettings':
      return { ok: true, settings: { inflation: null, affiliates: [], sponsor: null, requireApproval: false, feeds: [], ...store.get('settings', {}) } };
    case 'setSettings':
      store.set('settings', payload.settings || {});
      S.data.settings = { ...(S.data.settings || {}), ...(payload.settings || {}) };
      return { ok: true, settings: payload.settings };
    case 'audit':
      return { ok: true, entries: store.get('audit', []) };
    case 'pending':
      return { ok: true, pending: null };
    case 'approve':
    case 'reject':
      return { ok: true, applied: 0 };
    case 'backup':
      return { ok: true, backup: { version: 2, exported: new Date().toISOString(), settings: store.get('settings', {}), products: S.data.products } };
    case 'restore': {
      const list = payload.products || [];
      if (!list.length || !list.every((p) => p && p.id && p.category && p.name)) throw new Error('Soubor není záloha aplikace BuyWise');
      S.data.products = list;
      if (payload.settings) store.set('settings', payload.settings);
      persistLocal(['obnova ze zálohy', '', `${list.length} produktů`]);
      return { ok: true, restored: list.length };
    }
    default:
      throw new Error('Tahle akce funguje jen ve verzi nasazené na Vercelu (živá data, feedy, e-maily).');
  }
}

return { loadLocalData, adminAuth, adminLogin, adminLogout, adminLocal, adminApi };

// V samostatné HTML verzi se uloží přímo do prohlížeče jako menší obrázek.
async function resizeImage(file, maxW, quality) {
  const url = URL.createObjectURL(file);
  try {
    const img = await new Promise((res, rej) => {
      const i = new Image();
      i.onload = () => res(i);
      i.onerror = () => rej(new Error('Soubor se nepodařilo načíst jako obrázek.'));
      i.src = url;
    });
    const k = Math.min(1, maxW / img.naturalWidth);
    const cv = document.createElement('canvas');
    cv.width = Math.round(img.naturalWidth * k);
    cv.height = Math.round(img.naturalHeight * k);
    cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
    return { dataUrl: cv.toDataURL('image/jpeg', quality), w: cv.width, h: cv.height };
  } finally {
    URL.revokeObjectURL(url);
  }
}

function openBulk(pane, products) {

        return `<tr data-id="${esc(p.id)}"><td><input data-k="rank" value="${esc(p.rank ?? '')}" inputmode="numeric" size="3"></td><td>${esc(p.name)}</td><td class="num">${h.length ? money(h[h.length - 1].p, p.unit) : '—'}</td><td><input data-k="price" inputmode="decimal" size="9"></td><td><input data-k="demand" value="${esc(p.demand || '')}"></td></tr>`;

  actions({
    'adm-close-ed': () => (ed.innerHTML = ''),
    'adm-bulk-save': (b) =>
